<title>rehub report</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  --panel: #e3e5e6;
  --surface: #f3f4f4;
  --surface-2: #eaeced;
  --ink: #1e2327;
  --ink-2: #4a545b;
  --rail: #5a646b;
  --line: #b9bec2;
  --advisory: #0b7a99;
  --minor: #b76a00;
  --major: #b3261e;
  --on-lit: #ffffff;
  --focus: #0b5fff;
  --head: "DIN Alternate", "Bahnschrift", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #1b2124;
    --surface: #252c30;
    --surface-2: #2e373c;
    --ink: #e6e9ea;
    --ink-2: #a5afb5;
    --rail: #8b979e;
    --line: #435058;
    --advisory: #36b4d4;
    --minor: #e8a33a;
    --major: #ff6b5e;
    --on-lit: #14181a;
    --focus: #7aa7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #1b2124;
  --surface: #252c30;
  --surface-2: #2e373c;
  --ink: #e6e9ea;
  --ink-2: #a5afb5;
  --rail: #8b979e;
  --line: #435058;
  --advisory: #36b4d4;
  --minor: #e8a33a;
  --major: #ff6b5e;
  --on-lit: #14181a;
  --focus: #7aa7ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--panel); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--panel);
  color: var(--ink);
  font: 14px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, select { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }

/* left rail, drawn like a ladder rail with a terminal at each stop */
.rail {
  position: sticky; top: 0; height: 100vh;
  padding: 24px 0 20px 28px;
  display: flex; flex-direction: column;
}
.brand { font: 700 28px/1 var(--head); letter-spacing: 0.01em; margin: 0 0 28px; }
.brand small { display: block; font: 400 13px/1.4 var(--body); color: var(--ink-2); margin-top: 6px; letter-spacing: 0; }
.rail nav { position: relative; display: flex; flex-direction: column; gap: 2px; padding-left: 18px; }
.rail nav::before {
  content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 3px; background: var(--rail);
}
.rail button {
  position: relative; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 9px 12px 9px 14px; font: 500 17px/1.2 var(--head); color: var(--ink-2);
}
.rail button::before {
  content: ""; position: absolute; left: -18px; top: 50%; width: 11px; height: 11px; margin-top: -5px;
  border: 3px solid var(--rail); background: var(--panel); border-radius: 50%;
}
.rail button[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--surface); }
.rail button[aria-current="page"]::before { background: var(--ink); border-color: var(--ink); }
.rail button:hover { color: var(--ink); }
.rail .meta { margin-top: auto; padding-right: 20px; font-size: 12px; color: var(--ink-2); }

main { padding: 24px 32px 48px 24px; min-width: 0; }

/* annunciator: lit only when something is abnormal */
.annunciator { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
.win {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  min-height: 56px; padding: 8px 14px;
  background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--line);
}
.win .lamp { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rail); }
.win .legend { font: 600 16px/1.15 var(--head); }
.win .count { font: 700 20px/1 var(--head); color: var(--ink-2); min-width: 1.5ch; text-align: right; }
.win.lit { color: var(--on-lit); border-color: transparent; }
.win.lit .count { color: inherit; }
.win.lit .lamp { background: var(--on-lit); border-color: var(--on-lit); }
.win.major { background: var(--major); }
.win.minor { background: var(--minor); }
.win.advisory { background: var(--advisory); }
@media (prefers-reduced-motion: no-preference) {
  .win.lit .lamp { animation: lamp 0.9s ease-out 1; }
  .win.lit:nth-child(2) .lamp { animation-delay: 0.12s; }
  .win.lit:nth-child(3) .lamp { animation-delay: 0.24s; }
  .win.lit:nth-child(4) .lamp { animation-delay: 0.36s; }
  @keyframes lamp { 0% { transform: scale(0.4); opacity: 0; } 40% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(1); } }
}

h1 { font: 700 26px/1.15 var(--head); margin: 0 0 4px; }
.lede { color: var(--ink-2); margin: 0 0 18px; max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 0 0 18px; }
.controls label { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
select {
  min-width: 220px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--rail); border-radius: 0;
}

.panel { background: var(--surface); border: 1px solid var(--line); }

/* ladder rungs */
.rungs { list-style: none; margin: 0; padding: 0; }
.rung {
  display: grid; grid-template-columns: minmax(11ch, 14ch) minmax(0, 1fr) minmax(11ch, 14ch) 9.5rem;
  align-items: center; gap: 0 4px; padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.rung:last-child { border-bottom: 0; }
.node {
  font: 13px/1 var(--mono); padding: 8px 8px; background: var(--surface-2);
  border: 1px solid var(--rail); text-align: center; white-space: nowrap;
}
.wire { position: relative; display: flex; justify-content: center; align-items: center; height: 34px; color: var(--rail); }
.wire::before { content: ""; position: absolute; left: 0; right: 6px; top: 50%; height: 2px; background: currentColor; }
.wire::after {
  content: ""; position: absolute; right: 0; top: 50%; margin-top: -5px;
  border-left: 8px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.contact {
  position: relative; z-index: 1; padding: 3px 12px; background: var(--surface);
  border-left: 3px solid currentColor; border-right: 3px solid currentColor;
  font: 500 15px/1.2 var(--head); color: var(--ink); white-space: nowrap;
}
.contact .act { font-weight: 700; }
.contact .proto { color: var(--ink-2); }
.state { font: 600 14px/1.2 var(--head); padding-left: 10px; color: var(--ink-2); }
.state::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border: 2px solid currentColor; }

.rung.new-pair .wire { color: var(--major); }
.rung.new-pair .wire::before { height: 4px; margin-top: -1px; }
.rung.new-pair .state { color: var(--major); }
.rung.new-pair .state::before { background: currentColor; }
.rung.new-pair .node { border-color: var(--major); border-width: 2px; }
.rung.new-action .wire { color: var(--minor); }
.rung.new-action .wire::before { height: 4px; margin-top: -1px; }
.rung.new-action .state { color: var(--minor); }
.rung.new-action .state::before { background: currentColor; transform: rotate(45deg); }
.rung.missing-pair .wire, .rung.missing-action .wire { color: var(--rail); }
.rung.missing-pair .wire::before, .rung.missing-action .wire::before {
  background: repeating-linear-gradient(90deg, currentColor 0 7px, transparent 7px 12px);
}
.rung.missing-pair .contact, .rung.missing-action .contact { text-decoration: line-through; color: var(--ink-2); }
.rung.missing-pair .state { color: var(--advisory); }
.rung.missing-pair .state::before { border-style: dashed; }
.rung.unchanged .contact .act { font-weight: 500; }

.section-title { font: 600 17px/1.2 var(--head); margin: 22px 0 8px; }
.empty { padding: 28px 20px; max-width: 64ch; }
.empty p { margin: 0 0 8px; }
code, pre { font: 13px/1.5 var(--mono); }
code { background: var(--surface-2); padding: 1px 5px; }
pre { margin: 0; padding: 12px 14px; background: var(--surface-2); overflow-x: auto; border-top: 1px solid var(--line); }

/* doctor */
.tool { margin-bottom: 14px; }
.tool > header { display: flex; align-items: baseline; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tool h2 { font: 700 20px/1 var(--head); margin: 0; }
.tool .ver { color: var(--ink-2); font: 13px/1 var(--mono); }
.tool .verdict { margin-left: auto; font: 700 15px/1 var(--head); color: var(--ink-2); }
.tool.fail .verdict { color: var(--major); }
.tool.fail { border-top: 3px solid var(--major); }
.fx { display: grid; grid-template-columns: minmax(12ch, 24ch) 6ch 1fr; gap: 4px 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.fx:last-child { border-bottom: 0; }
.fx .name { font: 13px/1.4 var(--mono); }
.fx .status { font: 700 14px/1.2 var(--head); color: var(--ink-2); }
.fx.fail .status { color: var(--major); }
.fx ul { list-style: none; margin: 0; padding: 0; font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }

/* rules */
.rule > header { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; }
.rule h2 { font: 700 18px/1 var(--head); margin: 0; }
.badge { font: 600 13px/1 var(--head); padding: 3px 8px; border: 1px solid var(--rail); color: var(--ink-2); }
.badge.unvalidated { border-color: var(--minor); color: var(--minor); }
.rule .when { margin-left: auto; color: var(--ink-2); font-size: 12px; }
.rule { margin-bottom: 12px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; padding: 16px 16px 8px; }
  .rail nav { flex-direction: row; flex-wrap: wrap; padding-left: 0; gap: 4px; }
  .rail nav::before, .rail button::before { display: none; }
  .rail .meta { display: none; }
  .brand { margin-bottom: 12px; }
  main { padding: 8px 16px 40px; }
  .annunciator { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rung { grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .rung .wire { grid-column: 1 / -1; grid-row: 2; }
  .rung .state { grid-column: 1 / -1; grid-row: 3; padding-left: 0; }
  .fx { grid-template-columns: 1fr 6ch; }
  .fx ul { grid-column: 1 / -1; }
  select { min-width: 0; width: 100%; }
  .controls label { flex: 1 1 100%; }
}
</style>

<div class="app">
  <aside class="rail">
    <h2 class="brand">rehub<small>Passive OT traffic review</small></h2>
    <nav id="nav" aria-label="Views"></nav>
    <p class="meta" id="meta"></p>
  </aside>
  <main>
    <div class="annunciator" id="annunciator" role="status" aria-label="Alarm summary"></div>
    <div id="view"></div>
  </main>
</div>

<script>
const DATA = /*__REHUB_DATA__*/null;

const VIEWS = [
  { id: "changes", label: "Changes" },
  { id: "traffic", label: "Traffic" },
  { id: "doctor", label: "Doctor" },
  { id: "rules", label: "Rules" },
];
const state = { view: "changes", baseline: null, run: null, trafficRun: null };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const key = (i) => i.join("\u0000");
const pairKey = (i) => i[0] + "\u0000" + i[1];
const when = (iso) => (iso ? iso.replace("T", " ").replace(/\+00:00$/, " UTC") : "");

function runLabel(run) {
  const n = (DATA.observations[String(run.id)] || []).length;
  return `run ${run.id}, ${when(run.started_at)}, ${n} flows, ${run.input_sha256.slice(0, 8)}`;
}
function observedRuns() {
  return DATA.runs.filter((r) => String(r.id) in DATA.observations);
}

function rungsFor(items, stateOf) {
  const order = { "new-pair": 0, "new-action": 1, "missing-pair": 2, "missing-action": 3, unchanged: 4 };
  return items
    .map((i) => ({ item: i, st: stateOf(i) }))
    .sort((a, b) => order[a.st] - order[b.st] || key(a.item).localeCompare(key(b.item)));
}

const STATE_TEXT = {
  "new-pair": "New host pair",
  "new-action": "New action",
  "missing-pair": "Pair not seen",
  "missing-action": "Not seen",
  unchanged: "Same as baseline",
  seen: "Seen",
};

function rung({ item, st }) {
  const [src, dst, proto, action] = item;
  const isConn = action === "conn";
  return h("li", { class: `rung ${st}` },
    h("span", { class: "node" }, src),
    h("span", { class: "wire" },
      h("span", { class: "contact" },
        h("span", { class: "proto" }, proto),
        isConn ? "" : h("span", { class: "act" }, " " + action))),
    h("span", { class: "node" }, dst),
    h("span", { class: "state" }, STATE_TEXT[st]));
}

function empty(title, ...lines) {
  return h("div", { class: "panel empty" }, h("p", { class: "section-title", style: "margin-top:0" }, title), ...lines);
}

function select(label, options, value, onChange) {
  const sel = h("select", { onchange: (e) => onChange(e.target.value) },
    options.map((o) => h("option", { value: o.value, selected: o.value === value }, o.label)));
  return h("label", {}, label, sel);
}

function diffFor() {
  if (!state.baseline || state.run == null) return null;
  return DATA.diffs[`${state.baseline}|${state.run}`] || null;
}

function annunciator() {
  const d = diffFor();
  const fails = DATA.doctor.filter((r) => r.status !== "PASS").length;
  const windows = [
    ["New host pair", d ? d.new_pairs.length : 0, "major"],
    ["New action", d ? d.new_actions.length : 0, "minor"],
    ["Pair not seen", d ? d.missing_pairs.length : 0, "advisory"],
    ["Doctor failing", fails, "major"],
  ];
  const box = document.getElementById("annunciator");
  box.replaceChildren(...windows.map(([legend, n, level]) =>
    h("div", { class: `win ${n ? "lit " + level : ""}` },
      h("span", { class: "lamp", "aria-hidden": "true" }),
      h("span", { class: "legend" }, legend),
      h("span", { class: "count" }, n))));
}

function viewChanges() {
  if (!DATA.baselines.length) {
    return [h("h1", {}, "Changes"), empty("No baseline yet",
      h("p", {}, "A baseline is the traffic you call normal. Freeze one from an analyzed capture:"),
      h("p", {}, h("code", {}, "rehub analyze normal.pcap"), " then ", h("code", {}, "rehub baseline save plant-normal --run 1")))];
  }
  const runs = observedRuns();
  if (!runs.length) {
    return [h("h1", {}, "Changes"), empty("No analyzed capture yet",
      h("p", {}, "Analyze a capture to compare it with a baseline."),
      h("p", {}, h("code", {}, "rehub analyze capture.pcap")))];
  }
  const d = diffFor();
  const base = DATA.baselines.find((b) => b.name === state.baseline);
  const run = (DATA.observations[String(state.run)] || []);
  const baseKeys = new Set(base.items.map(key));
  const runKeys = new Set(run.map(key));
  const newPairs = new Set(d.new_pairs.map(pairKey));
  const newActions = new Set(d.new_actions.map(key));
  const missingPairs = new Set(d.missing_pairs.map(pairKey));

  const all = [...new Map([...base.items, ...run].map((i) => [key(i), i])).values()];
  const rows = rungsFor(all, (i) => {
    const inRun = runKeys.has(key(i)), inBase = baseKeys.has(key(i));
    if (inRun && inBase) return "unchanged";
    if (inRun) return newPairs.has(pairKey(i)) ? "new-pair" : newActions.has(key(i)) ? "new-action" : "new-action";
    return missingPairs.has(pairKey(i)) ? "missing-pair" : "missing-action";
  });

  const verdict = d.clean
    ? "This capture matches the baseline."
    : `${d.new_pairs.length} new host pair${d.new_pairs.length === 1 ? "" : "s"}, ${d.new_actions.length} new action${d.new_actions.length === 1 ? "" : "s"}, ${d.missing_pairs.length} pair${d.missing_pairs.length === 1 ? "" : "s"} not seen.`;
  return [
    h("h1", {}, "Changes"),
    h("p", { class: "lede" }, verdict, " Baselines never change; adopting new behavior means saving a new baseline."),
    h("div", { class: "controls" },
      select("Baseline", DATA.baselines.map((b) => ({ value: b.name, label: `${b.name} (${b.count} items, ${b.sha256.slice(0, 8)})` })), state.baseline,
        (v) => { state.baseline = v; render(); }),
      select("Capture", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.run),
        (v) => { state.run = Number(v); render(); })),
    h("ul", { class: "panel rungs" }, rows.map(rung)),
  ];
}

function viewTraffic() {
  const runs = observedRuns();
  if (!runs.length) {
    return [h("h1", {}, "Traffic"), empty("No analyzed capture yet",
      h("p", {}, "Flows appear here after you analyze a capture."),
      h("p", {}, h("code", {}, "rehub analyze capture.pcap")))];
  }
  const items = DATA.observations[String(state.trafficRun)] || [];
  const rows = items.map((i) => ({ item: i, st: "seen" }));
  const notes = DATA.runs.filter((r) => r.input_sha256 === (runs.find((x) => x.id === state.trafficRun) || {}).input_sha256 && r.tool !== "zeek");
  return [
    h("h1", {}, "Traffic"),
    h("p", { class: "lede" }, "Host pairs, protocols and engineering actions seen in a capture. A plain connection shows only the protocol."),
    h("div", { class: "controls" },
      select("Capture", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.trafficRun),
        (v) => { state.trafficRun = Number(v); render(); })),
    h("ul", { class: "panel rungs" }, rows.map(rung)),
    notes.length ? h("p", { class: "lede", style: "margin-top:12px" }, "Also stored for this capture: " + notes.map((n) => `${n.tool} ${n.version} (run ${n.id})`).join(", ") + ".") : null,
  ];
}

function viewDoctor() {
  if (!DATA.doctor.length) {
    return [h("h1", {}, "Doctor"), empty("Doctor has not run yet",
      h("p", {}, "Doctor replays synthetic captures through every tool and compares the output with the committed golden files."),
      h("p", {}, h("code", {}, "rehub doctor")))];
  }
  const byTool = new Map();
  for (const r of DATA.doctor) byTool.set(r.tool, [...(byTool.get(r.tool) || []), r]);
  const failedTool = ([, rows]) => rows.some((r) => r.status !== "PASS");
  const ordered = [...byTool].sort((a, b) => failedTool(b) - failedTool(a) || a[0].localeCompare(b[0]));
  const cards = ordered.map(([tool, rows]) => {
    const failed = rows.some((r) => r.status !== "PASS");
    return h("section", { class: `panel tool ${failed ? "fail" : ""}` },
      h("header", {},
        h("h2", {}, tool),
        h("span", { class: "ver" }, `${rows[0].version} in ${rows[0].image}`),
        h("span", { class: "verdict" }, failed ? "Differences found" : "Matches golden output")),
      rows.map((r) => h("div", { class: `fx ${r.status === "PASS" ? "" : "fail"}` },
        h("span", { class: "name" }, r.fixture),
        h("span", { class: "status" }, r.status === "PASS" ? "Pass" : "Fail"),
        r.lines.length ? h("ul", {}, r.lines.map((l) => h("li", {}, l))) : h("span"))));
  });
  return [
    h("h1", {}, "Doctor"),
    h("p", { class: "lede" }, "Latest result for each tool and fixture. A difference after a tool upgrade is what this check exists to catch."),
    ...cards,
  ];
}

function viewRules() {
  if (!DATA.rules.length) {
    return [h("h1", {}, "Rules"), empty("No drafted rules yet",
      h("p", {}, "Rules written with a model are stored here with their test status."),
      h("p", {}, h("code", {}, 'rehub yara draft "describe what to detect" --positive sample.bin --benign clean-dir')))];
  }
  return [
    h("h1", {}, "Rules"),
    h("p", { class: "lede" }, "A rule is validated only when it compiled and matched every positive sample and no benign file. Unvalidated rules need a human review."),
    ...DATA.rules.map((r) => h("article", { class: "panel rule" },
      h("header", {},
        h("h2", {}, r.name),
        h("span", { class: `badge ${r.status}` }, r.status === "validated" ? "Validated" : "Unvalidated"),
        h("span", { class: "when" }, when(r.created_at))),
      h("pre", {}, r.text))),
  ];
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.replaceChildren(...VIEWS.map((v) =>
    h("button", { type: "button", "aria-current": v.id === state.view ? "page" : false,
      onclick: () => { state.view = v.id; location.hash = v.id; render(); } }, v.label)));
}

function render() {
  renderNav();
  annunciator();
  const body = { changes: viewChanges, traffic: viewTraffic, doctor: viewDoctor, rules: viewRules }[state.view]();
  document.getElementById("view").replaceChildren(...body);
}

function init() {
  if (!DATA) {
    document.getElementById("view").replaceChildren(
      h("h1", {}, "No data"),
      empty("This page is a template", h("p", {}, "Generate a report with "), h("p", {}, h("code", {}, "rehub report"))));
    return;
  }
  const runs = observedRuns();
  state.baseline = DATA.baselines.length ? DATA.baselines[DATA.baselines.length - 1].name : null;
  state.run = runs.length ? runs[0].id : null;
  state.trafficRun = state.run;
  const wanted = location.hash.slice(1);
  if (VIEWS.some((v) => v.id === wanted)) state.view = wanted;
  document.getElementById("meta").textContent = `Snapshot of ${when(DATA.generated_at)}. Read only.`;
  render();
}
init();
</script>
