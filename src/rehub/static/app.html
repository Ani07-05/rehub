<title>rehub</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  --panel: #e3e5e6;
  --surface: #f3f4f4;
  --surface-2: #eaeced;
  --ink: #1e2327;
  --ink-2: #4a545b;
  --rail: #5a646b;
  --line: #b9bec2;
  --advisory: #0b7a99;
  --minor: #b76a00;
  --major: #b3261e;
  --on-lit: #ffffff;
  --focus: #0b5fff;
  --head: "DIN Alternate", "Bahnschrift", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #1b2124;
    --surface: #252c30;
    --surface-2: #2e373c;
    --ink: #e6e9ea;
    --ink-2: #a5afb5;
    --rail: #8b979e;
    --line: #435058;
    --advisory: #36b4d4;
    --minor: #e8a33a;
    --major: #ff6b5e;
    --on-lit: #14181a;
    --focus: #7aa7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #1b2124;
  --surface: #252c30;
  --surface-2: #2e373c;
  --ink: #e6e9ea;
  --ink-2: #a5afb5;
  --rail: #8b979e;
  --line: #435058;
  --advisory: #36b4d4;
  --minor: #e8a33a;
  --major: #ff6b5e;
  --on-lit: #14181a;
  --focus: #7aa7ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--panel); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--panel);
  color: var(--ink);
  font: 14px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, select { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }

/* left rail, drawn like a ladder rail with a terminal at each stop */
.rail {
  position: sticky; top: 0; height: 100vh;
  padding: 24px 0 20px 28px;
  display: flex; flex-direction: column;
}
.brand { font: 700 28px/1 var(--head); letter-spacing: 0.01em; margin: 0 0 28px; }
.brand small { display: block; font: 400 13px/1.4 var(--body); color: var(--ink-2); margin-top: 6px; letter-spacing: 0; }
.rail nav { position: relative; display: flex; flex-direction: column; gap: 2px; padding-left: 18px; }
.rail nav::before {
  content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 3px; background: var(--rail);
}
.rail button {
  position: relative; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 9px 12px 9px 14px; font: 500 17px/1.2 var(--head); color: var(--ink-2);
}
.rail button::before {
  content: ""; position: absolute; left: -18px; top: 50%; width: 11px; height: 11px; margin-top: -5px;
  border: 3px solid var(--rail); background: var(--panel); border-radius: 50%;
}
.rail button[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--surface); }
.rail button[aria-current="page"]::before { background: var(--ink); border-color: var(--ink); }
.rail button:hover { color: var(--ink); }
.rail .meta { margin-top: auto; padding-right: 20px; font-size: 12px; color: var(--ink-2); }

main { padding: 24px 32px 48px 24px; min-width: 0; }

/* annunciator: lit only when something is abnormal */
.annunciator { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
.win {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  min-height: 56px; padding: 8px 14px;
  background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--line);
}
.win .lamp { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rail); }
.win .legend { font: 600 16px/1.15 var(--head); }
.win .count { font: 700 20px/1 var(--head); color: var(--ink-2); min-width: 1.5ch; text-align: right; }
.win.lit { color: var(--on-lit); border-color: transparent; }
.win.lit .count { color: inherit; }
.win.lit .lamp { background: var(--on-lit); border-color: var(--on-lit); }
.win.major { background: var(--major); }
.win.minor { background: var(--minor); }
.win.advisory { background: var(--advisory); }
@media (prefers-reduced-motion: no-preference) {
  .win.lit .lamp { animation: lamp 0.9s ease-out 1; }
  .win.lit:nth-child(2) .lamp { animation-delay: 0.12s; }
  .win.lit:nth-child(3) .lamp { animation-delay: 0.24s; }
  .win.lit:nth-child(4) .lamp { animation-delay: 0.36s; }
  @keyframes lamp { 0% { transform: scale(0.4); opacity: 0; } 40% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(1); } }
}

h1 { font: 700 26px/1.15 var(--head); margin: 0 0 4px; }
.lede { color: var(--ink-2); margin: 0 0 18px; max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 0 0 18px; }
.controls label { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
select {
  min-width: 220px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--rail); border-radius: 0;
}

.panel { background: var(--surface); border: 1px solid var(--line); }

/* ladder rungs */
.rungs { list-style: none; margin: 0; padding: 0; }
.rung {
  display: grid; grid-template-columns: minmax(11ch, 14ch) minmax(0, 1fr) minmax(11ch, 14ch) 9.5rem;
  align-items: center; gap: 0 4px; padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.rung:last-child { border-bottom: 0; }
.node {
  font: 13px/1 var(--mono); padding: 8px 8px; background: var(--surface-2);
  border: 1px solid var(--rail); text-align: center; white-space: nowrap;
}
.wire { position: relative; display: flex; justify-content: center; align-items: center; height: 34px; color: var(--rail); }
.wire::before { content: ""; position: absolute; left: 0; right: 6px; top: 50%; height: 2px; background: currentColor; }
.wire::after {
  content: ""; position: absolute; right: 0; top: 50%; margin-top: -5px;
  border-left: 8px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.contact {
  position: relative; z-index: 1; padding: 3px 12px; background: var(--surface);
  border-left: 3px solid currentColor; border-right: 3px solid currentColor;
  font: 500 15px/1.2 var(--head); color: var(--ink); white-space: nowrap;
}
.contact .act { font-weight: 700; }
.contact .proto { color: var(--ink-2); }
.state { font: 600 14px/1.2 var(--head); padding-left: 10px; color: var(--ink-2); }
.state::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border: 2px solid currentColor; }

.rung.new-pair .wire { color: var(--major); }
.rung.new-pair .wire::before { height: 4px; margin-top: -1px; }
.rung.new-pair .state { color: var(--major); }
.rung.new-pair .state::before { background: currentColor; }
.rung.new-pair .node { border-color: var(--major); border-width: 2px; }
.rung.new-action .wire { color: var(--minor); }
.rung.new-action .wire::before { height: 4px; margin-top: -1px; }
.rung.new-action .state { color: var(--minor); }
.rung.new-action .state::before { background: currentColor; transform: rotate(45deg); }
.rung.missing-pair .wire, .rung.missing-action .wire { color: var(--rail); }
.rung.missing-pair .wire::before, .rung.missing-action .wire::before {
  background: repeating-linear-gradient(90deg, currentColor 0 7px, transparent 7px 12px);
}
.rung.missing-pair .contact, .rung.missing-action .contact { text-decoration: line-through; color: var(--ink-2); }
.rung.missing-pair .state { color: var(--advisory); }
.rung.missing-pair .state::before { border-style: dashed; }
.rung.unchanged .contact .act { font-weight: 500; }

.section-title { font: 600 17px/1.2 var(--head); margin: 22px 0 8px; }
.empty { padding: 28px 20px; max-width: 64ch; }
.empty p { margin: 0 0 8px; }
code, pre { font: 13px/1.5 var(--mono); }
code { background: var(--surface-2); padding: 1px 5px; }
pre { margin: 0; padding: 12px 14px; background: var(--surface-2); overflow-x: auto; border-top: 1px solid var(--line); }

/* doctor */
.tool { margin-bottom: 14px; }
.tool > header { display: flex; align-items: baseline; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tool h2 { font: 700 20px/1 var(--head); margin: 0; }
.tool .ver { color: var(--ink-2); font: 13px/1 var(--mono); }
.tool .verdict { margin-left: auto; font: 700 15px/1 var(--head); color: var(--ink-2); }
.tool.fail .verdict { color: var(--major); }
.tool.fail { border-top: 3px solid var(--major); }
.fx { display: grid; grid-template-columns: minmax(12ch, 24ch) 6ch 1fr; gap: 4px 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.fx:last-child { border-bottom: 0; }
.fx .name { font: 13px/1.4 var(--mono); }
.fx .status { font: 700 14px/1.2 var(--head); color: var(--ink-2); }
.fx.fail .status { color: var(--major); }
.fx ul { list-style: none; margin: 0; padding: 0; font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }

/* rules */
.rule > header { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; }
.rule h2 { font: 700 18px/1 var(--head); margin: 0; }
.badge { font: 600 13px/1 var(--head); padding: 3px 8px; border: 1px solid var(--rail); color: var(--ink-2); }
.badge.unvalidated { border-color: var(--minor); color: var(--minor); }
.rule .when { margin-left: auto; color: var(--ink-2); font-size: 12px; }
.rule { margin-bottom: 12px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; padding: 16px 16px 8px; }
  .rail nav { flex-direction: row; flex-wrap: wrap; padding-left: 0; gap: 4px; }
  .rail nav::before, .rail button::before { display: none; }
  .rail .meta { display: none; }
  .brand { margin-bottom: 12px; }
  main { padding: 8px 16px 40px; }
  .annunciator { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rung { grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .rung .wire { grid-column: 1 / -1; grid-row: 2; }
  .rung .state { grid-column: 1 / -1; grid-row: 3; padding-left: 0; }
  .fx { grid-template-columns: 1fr 6ch; }
  .fx ul { grid-column: 1 / -1; }
  select { min-width: 0; width: 100%; }
  .controls label { flex: 1 1 100%; }
}

/* actions */
.btn {
  padding: 8px 16px; background: var(--surface); border: 2px solid var(--ink); border-radius: 0; cursor: pointer;
  font: 600 15px/1.2 var(--head); color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--panel); }
.btn:hover:not(:disabled) { background: var(--ink); color: var(--panel); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
input[type="text"], textarea {
  padding: 7px 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--rail); border-radius: 0;
  font: 14px/1.4 var(--body); min-width: 240px;
}
textarea { width: 100%; min-height: 150px; font: 13px/1.5 var(--mono); resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.row label { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
.card { padding: 14px 16px; margin-bottom: 16px; }
.card h3 { font: 700 17px/1.2 var(--head); margin: 0 0 8px; }
.card p { margin: 0 0 10px; color: var(--ink-2); max-width: 70ch; }
.drop {
  display: grid; place-items: center; gap: 4px; min-height: 120px; padding: 18px; text-align: center; cursor: pointer;
  border: 2px dashed var(--rail); background: var(--surface);
}
.drop strong { font: 700 18px/1.2 var(--head); }
.drop span { color: var(--ink-2); }
.drop.over, .drop:hover { border-color: var(--ink); background: var(--surface-2); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.banner { padding: 10px 14px; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--advisory); }
.banner.error { border-left-color: var(--major); }
.banner.error strong { color: var(--major); }
.banner.busy { position: relative; overflow: hidden; }
.banner.busy::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
  background: repeating-linear-gradient(90deg, var(--advisory) 0 24px, transparent 24px 48px);
}
@media (prefers-reduced-motion: no-preference) {
  .banner.busy::after { animation: slide 1s linear infinite; }
  @keyframes slide { to { background-position: 48px 0; } }
}
details.card summary { cursor: pointer; font: 600 16px/1.2 var(--head); }
details.card[open] summary { margin-bottom: 12px; }
.toolrow { display: grid; grid-template-columns: minmax(14ch, 22ch) 1fr 1fr 8ch; gap: 4px 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font: 13px/1.4 var(--mono); }
.toolrow:last-child { border-bottom: 0; }
.toolrow .bad { color: var(--major); font-family: var(--head); font-weight: 700; }
.stack { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
.matches { margin: 10px 0 0; padding: 0; list-style: none; font: 14px/1.6 var(--mono); }

/* workflow */
.flow { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; max-width: 880px; }
.flow::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 14px; width: 3px; background: var(--rail); }
.step { position: relative; margin: 0 0 12px; padding: 14px 18px 16px; background: var(--surface); border: 1px solid var(--line); }
.step::before {
  content: ""; position: absolute; left: -30px; top: 17px; width: 11px; height: 11px;
  border: 3px solid var(--rail); background: var(--panel); border-radius: 50%;
}
.step.done::before { background: var(--ink); border-color: var(--ink); }
.step.next { border-color: var(--advisory); border-left: 4px solid var(--advisory); }
.step.next::before { border-color: var(--advisory); background: var(--advisory); box-shadow: 0 0 0 4px color-mix(in srgb, var(--advisory) 25%, transparent); }
.step.locked { opacity: 0.7; }
.step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.step h2 { font: 700 20px/1.2 var(--head); margin: 0; }
.step-status { margin-left: auto; font: 600 14px/1.2 var(--head); color: var(--ink-2); }
.step.next .step-status { color: var(--advisory); }
.step.done .step-status::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: var(--ink); }
.step .why { margin: 6px 0 0; color: var(--ink-2); max-width: 66ch; }
.step .summary { margin: 6px 0 0; font-weight: 600; }
.step .cli { margin: 0; color: var(--ink-2); }
.step-body { margin-top: 12px; }
.nextline { margin: 0 0 14px; padding: 8px 14px; background: var(--surface); border-left: 4px solid var(--advisory); }
.link { background: none; border: 0; padding: 0 0 0 6px; color: var(--advisory); font: 600 15px/1 var(--head); cursor: pointer; text-decoration: underline; }
</style>
<div class="app">
  <aside class="rail">
    <h2 class="brand">rehub<small>Passive OT traffic review</small></h2>
    <nav id="nav" aria-label="Views"></nav>
    <p class="meta" id="meta"></p>
  </aside>
  <main>
    <div class="annunciator" id="annunciator" role="status" aria-label="Alarm summary"></div>
    <div id="banner" aria-live="polite"></div>
    <div id="view"></div>
  </main>
</div>

<script>
const EMBEDDED = /*__REHUB_DATA__*/null;
let DATA = EMBEDDED;
const LIVE = EMBEDDED === null;

const VIEWS = [
  { id: "start", label: "Start" },
  { id: "changes", label: "Changes" },
  { id: "traffic", label: "Traffic" },
  { id: "doctor", label: "Doctor" },
  { id: "rules", label: "Rules" },
];
const state = {
  view: "start", baseline: null, run: null, trafficRun: null,
  busy: null, error: null, notice: null,
  analysis: null, toolCheck: null, yara: null,
  baselineName: "", doctorImage: "", rules: "", ruleSample: null,
  samples: [],
  draftDesc: "", draftProvider: "ollama", draftModel: "", draftPositives: [], draftBenign: [],
  draftResult: null, draftConfirm: null,
};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const key = (i) => i.join("\u0000");
const pairKey = (i) => i[0] + "\u0000" + i[1];
const when = (iso) => (iso ? iso.replace("T", " ").replace(/\+00:00$/, " UTC") : "");

/* ---- talking to the local server ---- */
async function api(path, options) {
  const opts = options || {};
  const res = await fetch(path, { ...opts, headers: { "X-Rehub": "1", ...(opts.headers || {}) } });
  let body = null;
  try { body = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) throw new Error(body && body.error ? body.error : `The server answered ${res.status}.`);
  return body;
}

function pickDefaults() {
  const runs = observedRuns();
  const names = DATA.baselines.map((b) => b.name);
  if (!names.includes(state.baseline)) state.baseline = names.length ? names[names.length - 1] : null;
  const ids = runs.map((r) => r.id);
  if (!ids.includes(state.run)) state.run = ids.length ? ids[0] : null;
  if (!ids.includes(state.trafficRun)) state.trafficRun = ids.length ? ids[0] : null;
}

async function refresh() {
  DATA = await api("/api/state");
  pickDefaults();
}

async function loadSamples() {
  try { state.samples = (await api("/api/samples")).samples; } catch (e) { state.samples = []; }
}

async function act(message, fn) {
  state.busy = message; state.error = null; state.notice = null;
  render();
  try { await fn(); } catch (e) { state.error = e.message || String(e); }
  state.busy = null;
  render();
}

async function finishAnalysis(result, label) {
  state.analysis = result;
  await refresh();
  if (result.zeek_run_id != null) { state.run = result.zeek_run_id; state.trafficRun = result.zeek_run_id; }
  if (state.view !== "start") state.view = "traffic";
  state.notice = `Analyzed ${label}.`;
}

function analyzeFile(file) {
  return act(`Analyzing ${file.name} with Zeek, Suricata and tshark. This can take a minute.`, async () => {
    const result = await api("/api/analyze", {
      method: "POST", body: file,
      headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(file.name) },
    });
    await finishAnalysis(result, file.name);
  });
}

function analyzeSample(name) {
  return act(`Analyzing the ${name} sample with Zeek, Suricata and tshark.`, async () => {
    const result = await api("/api/analyze-sample", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }),
    });
    await finishAnalysis(result, `${name}.pcap`);
  });
}

function saveBaseline(run) {
  const name = state.baselineName.trim();
  if (!name) { state.error = "Name the baseline first."; render(); return Promise.resolve(); }
  return act(`Saving baseline ${name}.`, async () => {
    await api("/api/baselines", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, run }) });
    await refresh();
    state.baseline = name; state.baselineName = ""; state.run = run;
    if (state.view !== "start") state.view = "changes";
    state.notice = `Saved baseline ${name}. It can no longer be changed.`;
  });
}

function runDoctor() {
  const image = state.doctorImage.trim();
  return act(`Running doctor${image ? " on " + image : ""}. This takes about half a minute.`, async () => {
    const result = await api("/api/doctor", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image }) });
    await refresh();
    if (state.view !== "start") state.view = "doctor";
    state.notice = result.passed ? "Every tool matches its golden output." : "Doctor found differences. Details below.";
  });
}

function checkTools() {
  return act("Checking tool versions in the image.", async () => {
    state.toolCheck = await api("/api/tools");
  });
}

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let out = "";
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(out);
}

function scanYara() {
  if (!state.rules.trim() || !state.ruleSample) {
    state.error = "Paste a rule and choose a sample file to scan.";
    render();
    return Promise.resolve();
  }
  const file = state.ruleSample;
  return act(`Scanning ${file.name}.`, async () => {
    const data = toBase64(await file.arrayBuffer());
    const result = await api("/api/yara/scan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rules: state.rules, filename: file.name, data }),
    });
    state.yara = { file: file.name, matches: result.matches };
  });
}

async function filesPayload(files) {
  return Promise.all(files.map(async (f) => ({ filename: f.name, data: toBase64(await f.arrayBuffer()) })));
}

function draftRule(confirmed) {
  if (!state.draftDesc.trim()) { state.error = "Describe what the rule should detect."; render(); return Promise.resolve(); }
  return act("Drafting a rule, then compiling it and testing it against your samples.", async () => {
    const body = {
      description: state.draftDesc, provider: state.draftProvider, model: state.draftModel.trim(), yes: confirmed === true,
      positives: await filesPayload(state.draftPositives), benign: await filesPayload(state.draftBenign),
    };
    const result = await api("/api/yara/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (result.needs_confirmation) { state.draftConfirm = result; state.draftResult = null; return; }
    state.draftConfirm = null;
    state.draftResult = result;
    await refresh();
  });
}

/* ---- shared pieces ---- */
function runLabel(run) {
  const n = (DATA.observations[String(run.id)] || []).length;
  return `run ${run.id}, ${when(run.started_at)}, ${n} flows, ${run.input_sha256.slice(0, 8)}`;
}
function observedRuns() {
  return DATA.runs.filter((r) => String(r.id) in DATA.observations);
}

function rungsFor(items, stateOf) {
  const order = { "new-pair": 0, "new-action": 1, "missing-pair": 2, "missing-action": 3, unchanged: 4, seen: 5 };
  return items
    .map((i) => ({ item: i, st: stateOf(i) }))
    .sort((a, b) => order[a.st] - order[b.st] || key(a.item).localeCompare(key(b.item)));
}

const STATE_TEXT = {
  "new-pair": "New host pair",
  "new-action": "New action",
  "missing-pair": "Pair not seen",
  "missing-action": "Not seen",
  unchanged: "Same as baseline",
  seen: "Seen",
};

function rung({ item, st }) {
  const [src, dst, proto, action] = item;
  const isConn = action === "conn";
  return h("li", { class: `rung ${st}` },
    h("span", { class: "node" }, src),
    h("span", { class: "wire" },
      h("span", { class: "contact" },
        h("span", { class: "proto" }, proto),
        isConn ? "" : h("span", { class: "act" }, " " + action))),
    h("span", { class: "node" }, dst),
    h("span", { class: "state" }, STATE_TEXT[st]));
}

function empty(title, ...lines) {
  return h("div", { class: "panel empty" }, h("p", { class: "section-title", style: "margin-top:0" }, title), ...lines);
}

function select(label, options, value, onChange) {
  const sel = h("select", { onchange: (e) => onChange(e.target.value) },
    options.map((o) => h("option", { value: o.value, selected: o.value === value }, o.label)));
  return h("label", {}, label, sel);
}

function btn(label, onClick, primary) {
  return h("button", { type: "button", class: `btn${primary ? " primary" : ""}`, disabled: !!state.busy, onclick: onClick }, label);
}

function dropZone() {
  const input = h("input", { type: "file", accept: ".pcap,.pcapng,.cap",
    onchange: (e) => { const f = e.target.files[0]; if (f) analyzeFile(f); } });
  const zone = h("label", { class: "drop",
    ondragover: (e) => { e.preventDefault(); zone.classList.add("over"); },
    ondragleave: () => zone.classList.remove("over"),
    ondrop: (e) => { e.preventDefault(); zone.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) analyzeFile(f); } },
    h("strong", {}, "Drop a capture here, or choose a file"),
    h("span", {}, "A .pcap or .pcapng. It is read only: the tools run with no network and nothing is sent."),
    input);
  return zone;
}

function baselineForm(run) {
  return h("div", { class: "row" },
    h("label", {}, "Baseline name",
      h("input", { type: "text", placeholder: "plant-normal", value: state.baselineName,
        oninput: (e) => { state.baselineName = e.target.value; } })),
    btn("Save baseline", () => saveBaseline(run), true));
}

function diffFor() {
  if (!state.baseline || state.run == null) return null;
  return DATA.diffs[`${state.baseline}|${state.run}`] || null;
}

/* ---- the workflow ---- */
function toolsChecked() {
  if (state.toolCheck) return state.toolCheck.tools.every((t) => t.ok);
  return DATA.tools.length > 0;
}

function steps() {
  const runs = observedRuns();
  const hasBaseline = DATA.baselines.length > 0;
  const failing = DATA.doctor.filter((r) => r.status !== "PASS").length;
  return [
    { id: "tools", view: "start", title: "Check the tools",
      why: "Confirms the tool image has the exact versions rehub was tested with.",
      done: toolsChecked(), cli: "rehub tools",
      summary: state.toolCheck ? (state.toolCheck.tools.every((t) => t.ok) ? "Every tool matches its pinned version." : "Some tools differ from their pinned version.") : (DATA.tools.length ? `${DATA.tools.length} tool versions recorded by earlier runs.` : "") },
    { id: "capture", view: "traffic", title: "Analyze a capture",
      why: "Reads a pcap with Zeek, Suricata and tshark. Nothing is sent to any network.",
      done: runs.length > 0, cli: "rehub analyze capture.pcap",
      summary: runs.length ? `${runs.length} capture${runs.length === 1 ? "" : "s"} analyzed.` : "" },
    { id: "baseline", view: "changes", title: "Freeze normal as a baseline",
      why: "Saves which host pairs and actions you expect. A saved baseline can never be changed.",
      done: hasBaseline, locked: runs.length === 0 ? "Analyze a capture first." : null, cli: "rehub baseline save plant-normal --run 1",
      summary: hasBaseline ? `Baseline ${DATA.baselines[DATA.baselines.length - 1].name} has ${DATA.baselines[DATA.baselines.length - 1].count} items.` : "" },
    { id: "compare", view: "changes", title: "Compare a new capture",
      why: "Analyze a later capture and see what is new or missing against the baseline.",
      done: hasBaseline && runs.length >= 2, locked: hasBaseline ? null : "Save a baseline first.", cli: "rehub baseline diff plant-normal --run 4",
      summary: hasBaseline && runs.length >= 2 ? "A later capture is ready to compare." : "" },
    { id: "doctor", view: "doctor", title: "Check your tools before an upgrade",
      why: "Replays test captures through every tool and names what a new version changes.",
      done: DATA.doctor.length > 0, cli: "rehub doctor",
      summary: DATA.doctor.length ? (failing ? `${failing} fixture${failing === 1 ? "" : "s"} differ from the golden output.` : "Every tool matches its golden output.") : "" },
    { id: "rules", view: "rules", title: "Write a detection rule", optional: true,
      why: "Optional. Draft a YARA rule with a model, then have it compiled and tested on your samples.",
      done: DATA.rules.length > 0, cli: 'rehub yara draft "what to detect" --positive sample.bin',
      summary: DATA.rules.length ? `${DATA.rules.length} rule${DATA.rules.length === 1 ? "" : "s"} stored.` : "" },
  ];
}

function nextStep() {
  return steps().find((st) => !st.done && !st.optional && !st.locked) || null;
}

function stepBody(st, all) {
  const runs = observedRuns();
  const parts = [];
  if (!LIVE) {
    parts.push(h("p", { class: "cli" }, "Command line: ", h("code", {}, st.cli)));
    return parts;
  }
  if (st.id === "tools") {
    parts.push(btn("Check tool versions", checkTools, !st.done), toolCheckCard());
  } else if (st.id === "capture" && !st.done) {
    parts.push(dropZone());
    if (state.samples.length) {
      parts.push(h("div", { class: "row", style: "margin-top:10px; align-items:center" },
        h("span", {}, "Or try a bundled sample:"), ...state.samples.map((n) => btn(n, () => analyzeSample(n), false))));
    }
  } else if (st.id === "capture" && st.done) {
    parts.push(btn("See the traffic", () => { state.view = "traffic"; render(); }, false));
  } else if (st.id === "baseline" && runs.length && !st.done) {
    parts.push(
      select("Capture to freeze", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.run), (v) => { state.run = Number(v); render(); }),
      h("div", { style: "height:12px" }), baselineForm(state.run));
  } else if (st.id === "compare" && all.find((x) => x.id === "baseline").done) {
    if (runs.length < 2) {
      parts.push(dropZone());
      if (state.samples.length) {
        parts.push(h("div", { class: "row", style: "margin-top:10px; align-items:center" },
          h("span", {}, "Or try a bundled sample:"), ...state.samples.map((n) => btn(n, () => analyzeSample(n), false))));
      }
    } else {
      parts.push(h("div", { class: "row" },
        btn("See the changes", () => { state.view = "changes"; render(); }, true),
        h("span", {}, "Analyze another capture any time from the Traffic page.")));
    }
  } else if (st.id === "doctor") {
    parts.push(h("div", { class: "row" },
      h("label", {}, "Image (blank for " + (DATA.image || "the default") + ")",
        h("input", { type: "text", placeholder: DATA.image || "rehub:pinned", value: state.doctorImage, oninput: (e) => { state.doctorImage = e.target.value; } })),
      btn(st.done ? "Run doctor again" : "Run doctor", runDoctor, !st.done),
      st.done ? btn("See the results", () => { state.view = "doctor"; render(); }, false) : null));
  } else if (st.id === "rules") {
    parts.push(btn("Open Rules", () => { state.view = "rules"; render(); }, false));
  }
  return parts;
}

function viewStart() {
  const all = steps();
  const next = nextStep();
  return [
    h("h1", {}, "Start"),
    h("p", { class: "lede" }, "rehub reviews traffic from your control network without touching it. Work down this list: freeze what normal looks like, then check every later capture, and your tools, against it."),
    h("ol", { class: "flow" }, all.map((st, i) => {
      const isNext = next && next.id === st.id;
      const status = st.done ? "Done" : st.locked ? st.locked : isNext ? "Do this next" : st.optional ? "Optional" : "Later";
      return h("li", { class: `step${st.done ? " done" : ""}${isNext ? " next" : ""}${st.locked ? " locked" : ""}`, "aria-current": isNext ? "step" : false },
        h("div", { class: "step-head" },
          h("h2", {}, st.title),
          h("span", { class: "step-status" }, status)),
        h("p", { class: "why" }, st.why),
        st.summary ? h("p", { class: "summary" }, st.summary) : null,
        st.locked ? null : h("div", { class: "step-body" }, stepBody(st, all)));
    })),
  ];
}

function nextLine() {
  const next = nextStep();
  if (!next || state.view === "start") return null;
  return h("p", { class: "nextline" }, "Next step: ", h("strong", {}, next.title), " ",
    h("button", { type: "button", class: "link", onclick: () => { state.view = "start"; location.hash = "start"; render(); } }, "Go to Start"));
}

/* ---- views ---- */
function viewChanges() {
  const runs = observedRuns();
  const head = h("h1", {}, "Changes");
  if (!runs.length) {
    return [head, empty("No capture analyzed yet",
      h("p", {}, LIVE ? "Analyze a capture first, then freeze one as your baseline of normal traffic." : "Analyze a capture to compare it with a baseline."),
      LIVE ? btn("Go to Traffic", () => { state.view = "traffic"; render(); }, true) : h("p", {}, h("code", {}, "rehub analyze capture.pcap")))];
  }
  if (!DATA.baselines.length) {
    return [head, h("div", { class: "panel card" },
      h("h3", {}, "No baseline yet"),
      h("p", {}, "A baseline is the traffic you call normal. Freeze a capture, then compare later captures with it. A saved baseline never changes."),
      LIVE ? [
        select("Capture to freeze", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.run), (v) => { state.run = Number(v); render(); }),
        h("div", { style: "height:12px" }),
        baselineForm(state.run),
      ] : h("p", {}, h("code", {}, "rehub baseline save plant-normal --run " + runs[0].id)))];
  }
  const d = diffFor();
  const base = DATA.baselines.find((b) => b.name === state.baseline);
  const run = DATA.observations[String(state.run)] || [];
  const baseKeys = new Set(base.items.map(key));
  const runKeys = new Set(run.map(key));
  const newPairs = new Set(d.new_pairs.map(pairKey));
  const missingPairs = new Set(d.missing_pairs.map(pairKey));

  const all = [...new Map([...base.items, ...run].map((i) => [key(i), i])).values()];
  const rows = rungsFor(all, (i) => {
    const inRun = runKeys.has(key(i)), inBase = baseKeys.has(key(i));
    if (inRun && inBase) return "unchanged";
    if (inRun) return newPairs.has(pairKey(i)) ? "new-pair" : "new-action";
    return missingPairs.has(pairKey(i)) ? "missing-pair" : "missing-action";
  });

  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const verdict = d.clean
    ? "This capture matches the baseline."
    : `${plural(d.new_pairs.length, "new host pair")}, ${plural(d.new_actions.length, "new action")}, ${plural(d.missing_pairs.length, "pair")} not seen.`;
  return [
    head,
    h("p", { class: "lede" }, verdict, " Baselines never change; adopting new behavior means saving a new baseline."),
    h("div", { class: "controls" },
      select("Baseline", DATA.baselines.map((b) => ({ value: b.name, label: `${b.name} (${b.count} items, ${b.sha256.slice(0, 8)})` })), state.baseline,
        (v) => { state.baseline = v; render(); }),
      select("Capture", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.run),
        (v) => { state.run = Number(v); render(); })),
    h("ul", { class: "panel rungs" }, rows.map(rung)),
    LIVE ? h("details", { class: "panel card", style: "margin-top:16px" },
      h("summary", {}, "Adopt this capture as a new baseline"),
      h("p", {}, "This saves a new baseline under a new name. The existing baseline stays exactly as it is."),
      baselineForm(state.run)) : null,
  ];
}

function analysisCard() {
  const a = state.analysis;
  if (!a) return null;
  return h("div", { class: "panel card" },
    h("h3", {}, `Analyzed ${a.filename}`),
    h("div", {}, a.runs.map((r) => h("div", { class: "toolrow" },
      h("span", {}, `${r.tool} ${r.version}`),
      h("span", {}, r.error ? r.error : Object.entries(r.summary).map(([k, v]) => `${k} ${v}`).join(", ") || "no output"),
      h("span", {}, `run ${r.run_id}`),
      h("span", { class: r.error ? "bad" : "" }, r.error ? "Failed" : "Done")))),
    a.zeek_run_id != null && !DATA.baselines.length ? h("div", { style: "margin-top:14px" },
      h("p", {}, "Save this capture as your baseline of normal traffic:"), baselineForm(a.zeek_run_id)) : null);
}

function viewTraffic() {
  const runs = observedRuns();
  const parts = [h("h1", {}, "Traffic")];
  if (LIVE) {
    parts.push(h("p", { class: "lede" }, "Analyze a capture to see which hosts talk, over which protocol, and what engineering actions they perform."), dropZone());
    if (state.samples.length) {
      parts.push(h("div", { class: "row", style: "margin:12px 0 0; align-items:center" },
        h("span", {}, "No capture handy? Try a bundled sample:"),
        ...state.samples.map((n) => btn(n, () => analyzeSample(n), false))));
    }
    parts.push(h("div", { style: "height:16px" }), analysisCard());
  }
  else parts.push(h("p", { class: "lede" }, "Host pairs, protocols and engineering actions seen in a capture. A plain connection shows only the protocol."));
  if (!runs.length) {
    if (!LIVE) parts.push(empty("No capture analyzed yet", h("p", {}, "Flows appear here after you analyze a capture."), h("p", {}, h("code", {}, "rehub analyze capture.pcap"))));
    return parts;
  }
  const items = DATA.observations[String(state.trafficRun)] || [];
  const current = runs.find((x) => x.id === state.trafficRun) || {};
  const notes = DATA.runs.filter((r) => r.input_sha256 === current.input_sha256 && r.tool !== "zeek");
  parts.push(
    h("div", { class: "controls" },
      select("Capture", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.trafficRun),
        (v) => { state.trafficRun = Number(v); render(); })),
    h("ul", { class: "panel rungs" }, items.map((i) => rung({ item: i, st: "seen" }))),
    notes.length ? h("p", { class: "lede", style: "margin-top:12px" }, "Also stored for this capture: " + notes.map((n) => `${n.tool} ${n.version} (run ${n.id})`).join(", ") + ".") : null);
  return parts;
}

function toolCheckCard() {
  const t = state.toolCheck;
  if (!t) return null;
  return h("div", { class: "panel card" },
    h("h3", {}, `Tool versions in ${t.image}`),
    t.tools.map((r) => h("div", { class: "toolrow" },
      h("span", {}, r.component), h("span", {}, `pinned ${r.pinned}`), h("span", {}, `installed ${r.installed}`),
      h("span", { class: r.ok ? "" : "bad" }, r.ok ? "Match" : "Differs"))));
}

function viewDoctor() {
  const parts = [h("h1", {}, "Doctor")];
  parts.push(h("p", { class: "lede" }, "Replays synthetic captures through every tool and compares the output with the committed golden files. A difference after a tool upgrade is what this check exists to catch."));
  if (LIVE) {
    parts.push(h("div", { class: "panel card" },
      h("h3", {}, "Check an image"),
      h("p", {}, "Leave the image blank to check " + (DATA.image || "the default image") + ". To test an upgrade first, enter a candidate such as rehub:candidate."),
      h("div", { class: "row" },
        h("label", {}, "Image",
          h("input", { type: "text", placeholder: DATA.image || "rehub:pinned", value: state.doctorImage,
            oninput: (e) => { state.doctorImage = e.target.value; } })),
        btn("Run doctor", runDoctor, true),
        btn("Check tool versions", checkTools, false))),
      toolCheckCard());
  }
  if (!DATA.doctor.length) {
    parts.push(empty("Doctor has not run yet",
      LIVE ? h("p", {}, "Run it above to compare every tool with its golden output.") : [h("p", {}, "Run it from the command line:"), h("p", {}, h("code", {}, "rehub doctor"))]));
    return parts;
  }
  const byTool = new Map();
  for (const r of DATA.doctor) byTool.set(r.tool, [...(byTool.get(r.tool) || []), r]);
  const failedTool = ([, rows]) => rows.some((r) => r.status !== "PASS");
  const ordered = [...byTool].sort((a, b) => failedTool(b) - failedTool(a) || a[0].localeCompare(b[0]));
  for (const [tool, rows] of ordered) {
    const failed = failedTool([tool, rows]);
    parts.push(h("section", { class: `panel tool ${failed ? "fail" : ""}` },
      h("header", {},
        h("h2", {}, tool),
        h("span", { class: "ver" }, `${rows[0].version} in ${rows[0].image}`),
        h("span", { class: "verdict" }, failed ? "Differences found" : "Matches golden output")),
      rows.map((r) => h("div", { class: `fx ${r.status === "PASS" ? "" : "fail"}` },
        h("span", { class: "name" }, r.fixture),
        h("span", { class: "status" }, r.status === "PASS" ? "Pass" : "Fail"),
        r.lines.length ? h("ul", {}, r.lines.map((l) => h("li", {}, l))) : h("span")))));
  }
  return parts;
}

function yaraCard() {
  const fileInput = h("input", { type: "file", onchange: (e) => { state.ruleSample = e.target.files[0] || null; } });
  const result = state.yara;

}

function draftCard() {

    h("h3", {}, "Draft a rule with a model"),

    h("label", { class: "stack" }, "What should it detect?",
      h("textarea", { style: "min-height:70px; font:14px/1.4 var(--body)", "aria-label": "Description", spellcheck: "true",
        placeholder: "S7comm job request that stops the PLC",

    h("div", { class: "row", style: "margin-top:10px" },
      select("Model provider", [{ value: "ollama", label: "Local (Ollama)" }, { value: "anthropic", label: "Hosted (Anthropic)" }], state.draftProvider,

        btn("Cancel", () => { state.draftConfirm = null; render(); }, false))) : null,

function draftResult(r) {
  const ok = r.status === "validated";
  const lines = [`Compile attempts: ${r.attempts}`];
  if (r.compile_error) lines.push(`Compiler error: ${r.compile_error}`);
  for (const [name, matched] of Object.entries(r.positives)) lines.push(`${name}: ${matched ? "matched" : "missed"}`);
  for (const name of r.benign_hits) lines.push(`${name}: matched, and it should not have`);
  return h("div", { style: "margin-top:16px" },
    h("div", { class: "row", style: "align-items:center" },
      h("h3", { style: "margin:0" }, "Drafted rule"),
      h("span", { class: `badge ${r.status}` }, ok ? "Validated" : "Unvalidated"),
      r.reason ? h("span", {}, r.reason) : null),
    h("pre", { style: "margin-top:8px" }, r.rule || "(no rule text)"),
    h("ul", { class: "matches" }, lines.map((l) => h("li", {}, l))),
    ok ? null : h("p", { style: "margin-top:10px" }, "A model wrote this rule and it did not pass every test. Review it before using it."));
}

function viewRules() {
  const parts = [h("h1", {}, "Rules")];
  parts.push(h("p", { class: "lede" }, "A rule is validated only when it compiled and matched every positive sample and no benign file. Unvalidated rules need a human review."));
  if (LIVE) parts.push(draftCard(), yaraCard());
  if (!DATA.rules.length) {
    parts.push(empty("No drafted rules yet",
      h("p", {}, "Rules written with a model are stored here with their test status."),
      LIVE ? null : h("p", {}, h("code", {}, 'rehub yara draft "describe what to detect" --positive sample.bin --benign clean-dir'))));
    return parts;
  }
  parts.push(...DATA.rules.map((r) => h("article", { class: "panel rule" },
    h("header", {},
      h("h2", {}, r.name),
      h("span", { class: `badge ${r.status}` }, r.status === "validated" ? "Validated" : "Unvalidated"),
      h("span", { class: "when" }, when(r.created_at))),
    h("pre", {}, r.text))));
  return parts;
}

/* ---- shell ---- */
function annunciator() {
  const d = diffFor();
  const fails = DATA.doctor.filter((r) => r.status !== "PASS").length;
  const windows = [
    ["New host pair", d ? d.new_pairs.length : 0, "major"],
    ["New action", d ? d.new_actions.length : 0, "minor"],
    ["Pair not seen", d ? d.missing_pairs.length : 0, "advisory"],
    ["Doctor failing", fails, "major"],
  ];
  document.getElementById("annunciator").replaceChildren(...windows.map(([legend, n, level]) =>
    h("div", { class: `win ${n ? "lit " + level : ""}` },
      h("span", { class: "lamp", "aria-hidden": "true" }),
      h("span", { class: "legend" }, legend),
      h("span", { class: "count", title: known ? "" : "Not checked yet" }, known ? n : "-"))));
}

function banner() {
  const box = document.getElementById("banner");
  if (state.busy) box.replaceChildren(h("div", { class: "banner busy", role: "status" }, state.busy));
  else if (state.error) box.replaceChildren(h("div", { class: "banner error", role: "alert" }, h("strong", {}, "Could not finish. "), state.error));
  else if (state.notice) box.replaceChildren(h("div", { class: "banner", role: "status" }, state.notice));
  else box.replaceChildren();
}

function renderNav() {
  document.getElementById("nav").replaceChildren(...VIEWS.map((v) =>
    h("button", { type: "button", "aria-current": v.id === state.view ? "page" : false,
      onclick: () => { state.view = v.id; state.error = null; state.notice = null; location.hash = v.id; render(); } }, v.label)));
}

function render() {
  renderNav();
  annunciator();
  banner();
  const body = { start: viewStart, changes: viewChanges, traffic: viewTraffic, doctor: viewDoctor, rules: viewRules }[state.view]();
  const line = LIVE ? nextLine() : null;
  if (line) body.splice(1, 0, line);
  document.getElementById("view").replaceChildren(...body);
}

async function init() {
  const wanted = location.hash.slice(1);
  if (!LIVE) state.view = "changes";
  if (VIEWS.some((v) => v.id === wanted)) state.view = wanted;
  if (LIVE) {
    try {
      await refresh();
    } catch (e) {
      document.getElementById("view").replaceChildren(
        h("h1", {}, "Cannot reach rehub"),
        empty("The local server did not answer", h("p", {}, e.message), h("p", {}, "Start it again with ", h("code", {}, "rehub web"), ".")));
      return;
    }
    await loadSamples();
    document.getElementById("meta").textContent = `Live on this computer. Tools run in ${DATA.image} with no network.`;
  } else {
    pickDefaults();
    document.getElementById("meta").textContent = `Snapshot of ${when(DATA.generated_at)}. Read only.`;
  }
  render();
}
init();
</script>
