<title>rehub</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  --panel: #e3e5e6;
  --surface: #f3f4f4;
  --surface-2: #eaeced;
  --ink: #1e2327;
  --ink-2: #4a545b;
  --rail: #5a646b;
  --line: #b9bec2;
  --advisory: #0b7a99;
  --minor: #b76a00;
  --major: #b3261e;
  --on-lit: #ffffff;
  --focus: #0b5fff;
  --head: "DIN Alternate", "Bahnschrift", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #1b2124;
    --surface: #252c30;
    --surface-2: #2e373c;
    --ink: #e6e9ea;
    --ink-2: #a5afb5;
    --rail: #8b979e;
    --line: #435058;
    --advisory: #36b4d4;
    --minor: #e8a33a;
    --major: #ff6b5e;
    --on-lit: #14181a;
    --focus: #7aa7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #1b2124;
  --surface: #252c30;
  --surface-2: #2e373c;
  --ink: #e6e9ea;
  --ink-2: #a5afb5;
  --rail: #8b979e;
  --line: #435058;
  --advisory: #36b4d4;
  --minor: #e8a33a;
  --major: #ff6b5e;
  --on-lit: #14181a;
  --focus: #7aa7ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--panel); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--panel);
  color: var(--ink);
  font: 14px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, select { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }

/* left rail, drawn like a ladder rail with a terminal at each stop */
.rail {
  position: sticky; top: 0; height: 100vh;
  padding: 24px 0 20px 28px;
  display: flex; flex-direction: column;
}
.brand { font: 700 28px/1 var(--head); letter-spacing: 0.01em; margin: 0 0 28px; }
.brand small { display: block; font: 400 13px/1.4 var(--body); color: var(--ink-2); margin-top: 6px; letter-spacing: 0; }
.rail nav { position: relative; display: flex; flex-direction: column; gap: 2px; padding-left: 18px; }
.rail nav::before {
  content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 3px; background: var(--rail);
}
.rail button {
  position: relative; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 9px 12px 9px 14px; font: 500 17px/1.2 var(--head); color: var(--ink-2);
}
.rail button::before {
  content: ""; position: absolute; left: -18px; top: 50%; width: 11px; height: 11px; margin-top: -5px;
  border: 3px solid var(--rail); background: var(--panel); border-radius: 50%;
}
.rail button[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--surface); }
.rail button[aria-current="page"]::before { background: var(--ink); border-color: var(--ink); }
.rail button:hover { color: var(--ink); }
.rail .meta { margin-top: auto; padding-right: 20px; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }

main { padding: 24px 32px 96px 24px; min-width: 0; }
[hidden] { display: none !important; }

/* annunciator: lit only when something is abnormal */
.annunciator { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
.win {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  min-height: 56px; padding: 8px 14px;
  background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--line);
}
.win .lamp { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rail); }
.win .legend { font: 600 16px/1.15 var(--head); }
.win .count { font: 700 20px/1 var(--head); color: var(--ink-2); min-width: 1.5ch; text-align: right; }
.win.lit { color: var(--on-lit); border-color: transparent; }
.win.lit .count { color: inherit; }
.win.lit .lamp { background: var(--on-lit); border-color: var(--on-lit); }
.win.major { background: var(--major); }
.win.minor { background: var(--minor); }
.win.advisory { background: var(--advisory); }
@media (prefers-reduced-motion: no-preference) {
  .win.lit .lamp { animation: lamp 0.9s ease-out 1; }
  .win.lit:nth-child(2) .lamp { animation-delay: 0.12s; }
  .win.lit:nth-child(3) .lamp { animation-delay: 0.24s; }
  .win.lit:nth-child(4) .lamp { animation-delay: 0.36s; }
  @keyframes lamp { 0% { transform: scale(0.4); opacity: 0; } 40% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(1); } }
}

h1 { font: 700 26px/1.15 var(--head); margin: 0 0 4px; }
.lede { color: var(--ink-2); margin: 0 0 18px; max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 0 0 18px; }
.controls label { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
select {
  min-width: 220px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--rail); border-radius: 0;
}

.panel { background: var(--surface); border: 1px solid var(--line); }

/* ladder rungs */
.rungs { list-style: none; margin: 0; padding: 0; }
.rung {
  display: grid; grid-template-columns: minmax(11ch, 14ch) minmax(0, 1fr) minmax(11ch, 14ch) 9.5rem;
  align-items: center; gap: 0 4px; padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.rung:last-child { border-bottom: 0; }
.node {
  font: 13px/1 var(--mono); padding: 8px 8px; background: var(--surface-2);
  border: 1px solid var(--rail); text-align: center; white-space: nowrap;
}
.wire { position: relative; display: flex; justify-content: center; align-items: center; height: 34px; color: var(--rail); }
.wire::before { content: ""; position: absolute; left: 0; right: 6px; top: 50%; height: 2px; background: currentColor; }
.wire::after {
  content: ""; position: absolute; right: 0; top: 50%; margin-top: -5px;
  border-left: 8px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.contact {
  position: relative; z-index: 1; padding: 3px 12px; background: var(--surface);
  border-left: 3px solid currentColor; border-right: 3px solid currentColor;
  font: 500 15px/1.2 var(--head); color: var(--ink); white-space: nowrap;
}
.contact .act { font-weight: 700; }
.contact .proto { color: var(--ink-2); }
.state { font: 600 14px/1.2 var(--head); padding-left: 10px; color: var(--ink-2); }
.state::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border: 2px solid currentColor; }

.rung.new-pair .wire { color: var(--major); }
.rung.new-pair .wire::before { height: 4px; margin-top: -1px; }
.rung.new-pair .state { color: var(--major); }
.rung.new-pair .state::before { background: currentColor; }
.rung.new-pair .node { border-color: var(--major); border-width: 2px; }
.rung.new-action .wire { color: var(--minor); }
.rung.new-action .wire::before { height: 4px; margin-top: -1px; }
.rung.new-action .state { color: var(--minor); }
.rung.new-action .state::before { background: currentColor; transform: rotate(45deg); }
.rung.missing-pair .wire, .rung.missing-action .wire { color: var(--rail); }
.rung.missing-pair .wire::before, .rung.missing-action .wire::before {
  background: repeating-linear-gradient(90deg, currentColor 0 7px, transparent 7px 12px);
}
.rung.missing-pair .contact, .rung.missing-action .contact { text-decoration: line-through; color: var(--ink-2); }
.rung.missing-pair .state { color: var(--advisory); }
.rung.missing-pair .state::before { border-style: dashed; }
.rung.unchanged .contact .act { font-weight: 500; }

.section-title { font: 600 17px/1.2 var(--head); margin: 22px 0 8px; }
.empty { padding: 28px 20px; max-width: 64ch; }
.empty p { margin: 0 0 8px; }
code, pre { font: 13px/1.5 var(--mono); }
code { background: var(--surface-2); padding: 1px 5px; }
pre { margin: 0; padding: 12px 14px; background: var(--surface-2); overflow-x: auto; border-top: 1px solid var(--line); }

/* doctor */
.tool { margin-bottom: 14px; }
.tool > header { display: flex; align-items: baseline; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tool h2 { font: 700 20px/1 var(--head); margin: 0; }
.tool .ver { color: var(--ink-2); font: 13px/1 var(--mono); }
.tool .verdict { margin-left: auto; font: 700 15px/1 var(--head); color: var(--ink-2); }
.tool.fail .verdict { color: var(--major); }
.tool.fail { border-top: 3px solid var(--major); }
.fx { display: grid; grid-template-columns: minmax(12ch, 24ch) 6ch 1fr; gap: 4px 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.fx:last-child { border-bottom: 0; }
.fx .name { font: 13px/1.4 var(--mono); }
.fx .status { font: 700 14px/1.2 var(--head); color: var(--ink-2); }
.fx.fail .status { color: var(--major); }
.fx ul { list-style: none; margin: 0; padding: 0; font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }

/* rules */
.rule > header { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; }
.rule h2 { font: 700 18px/1 var(--head); margin: 0; }
.badge { font: 600 13px/1 var(--head); padding: 3px 8px; border: 1px solid var(--rail); color: var(--ink-2); }
.badge.unvalidated { border-color: var(--minor); color: var(--minor); }
.rule .when { margin-left: auto; color: var(--ink-2); font-size: 12px; }
.rule { margin-bottom: 12px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; padding: 16px 16px 8px; }
  .rail nav { flex-direction: row; flex-wrap: wrap; padding-left: 0; gap: 4px; }
  .rail nav::before, .rail button::before { display: none; }
  .rail .meta { display: none; }
  .brand { margin-bottom: 12px; }
  main { padding: 8px 16px 40px; }
  .annunciator { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rung { grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .rung .wire { grid-column: 1 / -1; grid-row: 2; }
  .rung .state { grid-column: 1 / -1; grid-row: 3; padding-left: 0; }
  .fx { grid-template-columns: 1fr 6ch; }
  .fx ul { grid-column: 1 / -1; }
  select { min-width: 0; width: 100%; }
  .controls label { flex: 1 1 100%; }
}

/* actions */
.btn {
  padding: 8px 16px; background: var(--surface); border: 2px solid var(--ink); border-radius: 0; cursor: pointer;
  font: 600 15px/1.2 var(--head); color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--panel); }
.btn:hover:not(:disabled) { background: var(--ink); color: var(--panel); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
input[type="text"], textarea {
  padding: 7px 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--rail); border-radius: 0;
  font: 14px/1.4 var(--body); min-width: 240px;
}
textarea { width: 100%; min-height: 150px; font: 13px/1.5 var(--mono); resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.row label { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
.card { padding: 14px 16px; margin-bottom: 16px; }
.card h3 { font: 700 17px/1.2 var(--head); margin: 0 0 8px; }
.card p { margin: 0 0 10px; color: var(--ink-2); max-width: 70ch; }
.drop {
  display: grid; place-items: center; gap: 4px; min-height: 120px; padding: 18px; text-align: center; cursor: pointer;
  border: 2px dashed var(--rail); background: var(--surface);
}
.drop strong { font: 700 18px/1.2 var(--head); }
.drop span { color: var(--ink-2); }
.drop.over, .drop:hover { border-color: var(--ink); background: var(--surface-2); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.banner { padding: 10px 14px; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--advisory); }
.banner.error { border-left-color: var(--major); }
.banner.error strong { color: var(--major); }
.banner.busy { position: relative; overflow: hidden; }
.banner.busy::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
  background: repeating-linear-gradient(90deg, var(--advisory) 0 24px, transparent 24px 48px);
}
@media (prefers-reduced-motion: no-preference) {
  .banner.busy::after { animation: slide 1s linear infinite; }
  @keyframes slide { to { background-position: 48px 0; } }
}
details.card summary { cursor: pointer; font: 600 16px/1.2 var(--head); }
details.card[open] summary { margin-bottom: 12px; }
.toolrow { display: grid; grid-template-columns: minmax(14ch, 22ch) 1fr 1fr 8ch; gap: 4px 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font: 13px/1.4 var(--mono); }
.toolrow:last-child { border-bottom: 0; }
.toolrow .bad { color: var(--major); font-family: var(--head); font-weight: 700; }
.stack { display: grid; gap: 4px; font: 500 14px/1.2 var(--head); color: var(--ink-2); }
.matches { margin: 10px 0 0; padding: 0; list-style: none; font: 14px/1.6 var(--mono); }

/* workflow */
.flow { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; max-width: 880px; }
.flow::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 14px; width: 3px; background: var(--rail); }
.step { position: relative; margin: 0 0 12px; padding: 14px 18px 16px; background: var(--surface); border: 1px solid var(--line); }
.step::before {
  content: ""; position: absolute; left: -30px; top: 17px; width: 11px; height: 11px;
  border: 3px solid var(--rail); background: var(--panel); border-radius: 50%;
}
.step.done::before { background: var(--ink); border-color: var(--ink); }
.step.next { border-color: var(--advisory); border-left: 4px solid var(--advisory); }
.step.next::before { border-color: var(--advisory); background: var(--advisory); box-shadow: 0 0 0 4px color-mix(in srgb, var(--advisory) 25%, transparent); }
.step.locked { opacity: 0.7; }
.step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.step h2 { font: 700 20px/1.2 var(--head); margin: 0; }
.step-status { margin-left: auto; font: 600 14px/1.2 var(--head); color: var(--ink-2); }
.step.next .step-status { color: var(--advisory); }
.step.done .step-status::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: var(--ink); }
.step .why { margin: 6px 0 0; color: var(--ink-2); max-width: 66ch; }
.step .summary { margin: 6px 0 0; font-weight: 600; }
.step .cli { margin: 0; color: var(--ink-2); }
.step-body { margin-top: 12px; }
.nextline { margin: 0 0 14px; padding: 8px 14px; background: var(--surface); border-left: 4px solid var(--advisory); }
.link { background: none; border: 0; padding: 0 0 0 6px; color: var(--advisory); font: 600 15px/1 var(--head); cursor: pointer; text-decoration: underline; }

/* plain-language findings */
.changes { list-style: none; margin: 0 0 18px; padding: 0; }
.changes li { position: relative; padding: 11px 16px 11px 40px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; }
.changes li:last-child { border-bottom: 1px solid var(--line); }
.changes li::before { content: ""; position: absolute; left: 16px; top: 17px; width: 11px; height: 11px; background: currentColor; }
.changes .high { color: var(--major); }
.changes .medium { color: var(--minor); }
.changes .medium::before { transform: rotate(45deg); }
.changes .low { color: var(--advisory); }
.changes .low::before { background: none; border: 2px dashed currentColor; }
.changes .said { color: var(--ink); font: 600 16px/1.35 var(--head); }
.changes .hint { display: block; color: var(--ink-2); font: 14px/1.4 var(--body); margin-top: 2px; }

/* plc review */
.sev { display: inline-block; font: 700 13px/1 var(--head); padding: 3px 8px; border: 2px solid currentColor; }
.sev.high { color: var(--major); }
.sev.medium { color: var(--minor); }
.sev.low { color: var(--advisory); }
.finding { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; }
.finding h4 { margin: 6px 0 4px; font: 700 17px/1.25 var(--head); }
.finding code { display: block; margin: 6px 0; padding: 6px 10px; overflow-x: auto; white-space: pre; }
.finding p { margin: 4px 0 0; max-width: 72ch; }
.finding .lbl { font-weight: 700; }
.diffline { font: 13px/1.5 var(--mono); padding: 2px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diffline.add { background: color-mix(in srgb, var(--advisory) 14%, transparent); }
.diffline.del { background: color-mix(in srgb, var(--rail) 18%, transparent); text-decoration: line-through; }
.diffline.val { background: color-mix(in srgb, var(--minor) 16%, transparent); }
.kv { display: grid; grid-template-columns: minmax(10ch, 16ch) 1fr; gap: 4px 14px; font: 13px/1.5 var(--mono); }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.node { line-height: 1.2; }
.node .nm { display: block; margin-bottom: 3px; font: 600 12px/1.2 var(--head); color: var(--ink-2); white-space: normal; }
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 0 0 20px; max-width: 880px; }
.choice .opt { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--advisory); }
.choice .opt h2 { font: 700 20px/1.2 var(--head); margin: 0 0 6px; }
.choice .opt p { margin: 0 0 12px; color: var(--ink-2); }
.progress { max-width: 880px; margin: 0 0 14px; font: 600 14px/1.2 var(--head); color: var(--ink-2); }
.progress .track { height: 6px; margin-top: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.progress .fill { height: 100%; background: var(--ink); }
.devrow { display: grid; grid-template-columns: minmax(12ch, 16ch) 1fr minmax(180px, 260px); gap: 6px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.devrow:last-child { border-bottom: 0; }
.devrow .ip { font: 13px/1.3 var(--mono); }
.devrow .role { color: var(--ink-2); font-size: 13px; }
.devrow input { min-width: 0; width: 100%; }
.fine { color: var(--ink-2); font-size: 13px; max-width: 70ch; margin: 8px 0 0; }
@media (max-width: 860px) { .devrow { grid-template-columns: 1fr; } }
/* help assistant */
.helpbtn {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  padding: 11px 18px; background: var(--ink); color: var(--panel); border: 0; cursor: pointer; font: 700 16px/1 var(--head);
}
.help {
  position: fixed; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  width: min(420px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 110px)); display: flex; flex-direction: column;
  background: var(--surface); border: 2px solid var(--ink);
}
.help[hidden] { display: none; }
.help header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.help header strong { font: 700 18px/1.2 var(--head); }
.help header span { display: block; color: var(--ink-2); font-size: 13px; }
.help .log { padding: 12px 16px; overflow-y: auto; flex: 1; }
.help .q { font: 600 15px/1.3 var(--head); margin: 12px 0 4px; }
.help .q:first-child { margin-top: 0; }
.help .a { margin: 0 0 6px; white-space: pre-wrap; }
.help .src { color: var(--ink-2); font-size: 12px; }
.help .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { padding: 5px 10px; background: var(--surface-2); border: 1px solid var(--rail); cursor: pointer; font: 500 14px/1.2 var(--body); }
.chip:hover { border-color: var(--ink); }
.help form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.help form input { flex: 1; min-width: 0; }
.help details { padding: 0 16px 10px; font-size: 13px; }
.help details summary { cursor: pointer; color: var(--ink-2); }
.help .boxed { margin-top: 8px; padding: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.help pre { max-height: 140px; overflow: auto; }
.datapaths { display: grid; gap: 4px; margin: 8px 0 0; font: 13px/1.5 var(--mono); }
.datapaths span { color: var(--ink-2); font-family: var(--body); }
details.explain { margin: 10px 0 0; }
details.explain summary { cursor: pointer; font: 600 15px/1.2 var(--head); }
details.explain p { margin: 8px 0 0; max-width: 66ch; color: var(--ink-2); }
@media (max-width: 860px) { .changes li { padding-left: 36px; } }
</style>

<div class="app">
  <aside class="rail">
    <h2 class="brand">rehub<small>Did anything change on your plant network?</small></h2>
    <nav id="nav" aria-label="Pages"></nav>
    <p class="meta" id="meta"></p>
  </aside>
  <main>
    <div class="annunciator" id="annunciator" role="status" aria-label="Alarm summary"></div>
    <div id="banner" aria-live="polite"></div>
    <div id="view"></div>
  </main>
</div>
<button type="button" class="helpbtn" id="helpbtn" hidden aria-controls="help" aria-expanded="false">Ask for help</button>
<aside class="help" id="help" hidden aria-label="Help assistant"></aside>

<script>
const EMBEDDED = /*__REHUB_DATA__*/null;
let DATA = EMBEDDED;
const LIVE = EMBEDDED === null;

const VIEWS = [
  { id: "start", label: "Start" },
  { id: "changes", label: "What changed" },
  { id: "traffic", label: "Conversations" },
  { id: "plc", label: "PLC code" },
  { id: "doctor", label: "Upgrade check" },
  { id: "rules", label: "Detection rules" },
];
const state = {
  view: "start", baseline: null, run: null, trafficRun: null,
  busy: null, error: null, notice: null,
  analysis: null, toolCheck: null, yara: null,
  baselineName: "", doctorImage: "", rules: "", ruleSample: null,
  samples: [],
  draftDesc: "", draftProvider: "ollama", draftModel: "", draftPositives: [], draftBenign: [],
  draftResult: null, draftConfirm: null,
  plc: { file: null, name: "", text: "", result: null, approveName: "" },
  help: { open: false, question: "", log: [], confirm: null, error: null, busy: false, provider: "ollama", model: "" },
};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const key = (i) => i.join("\u0000");
const pairKey = (i) => i[0] + "\u0000" + i[1];
const when = (iso) => (iso ? iso.replace("T", " ").replace(/\+00:00$/, " UTC") : "");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ---- talking to the local server ---- */
async function api(path, options) {
  const opts = options || {};
  const res = await fetch(path, { ...opts, headers: { "X-Rehub": "1", ...(opts.headers || {}) } });
  let body = null;
  try { body = await res.json(); } catch (e) { /* not JSON */ }
  if (res.status === 401) {
    const locked = new Error("Your session ended. rehub was restarted or its private link changed. Open the new link printed in the terminal where you ran rehub web.");
    locked.locked = true;
    throw locked;
  }
  if (!res.ok) throw new Error(body && body.error ? body.error : `The server answered ${res.status}.`);
  return body;
}
const postJson = (path, payload) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });

function pickDefaults() {
  const runs = observedRuns();
  const names = DATA.baselines.map((b) => b.name);
  if (!names.includes(state.baseline)) state.baseline = names.length ? names[names.length - 1] : null;
  const ids = runs.map((r) => r.id);
  if (!ids.includes(state.run)) state.run = ids.length ? ids[0] : null;
  if (!ids.includes(state.trafficRun)) state.trafficRun = ids.length ? ids[0] : null;
}

async function refresh() {
  DATA = await api("/api/state");
  pickDefaults();
}

async function loadSamples() {
  try { state.samples = (await api("/api/samples")).samples; } catch (e) { state.samples = []; }
}

async function act(message, fn) {
  state.busy = message; state.error = null; state.notice = null;
  render();
  try { await fn(); } catch (e) { state.error = e.message || String(e); }
  state.busy = null;
  render();
}

async function finishAnalysis(result, label) {
  state.analysis = result;
  await refresh();
  if (result.zeek_run_id != null) { state.run = result.zeek_run_id; state.trafficRun = result.zeek_run_id; }
  if (state.view !== "start") state.view = "traffic";
  state.notice = `Loaded ${label}.`;
}

function analyzeFile(file) {
  return act(`Reading ${file.name}. This can take a minute. Nothing is sent to any network.`, async () => {
    const result = await api("/api/analyze", {
      method: "POST", body: file,
      headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(file.name) },
    });
    await finishAnalysis(result, file.name);
  });
}

function analyzeSample(name) {
  return act(`Reading the ${name} sample recording.`, async () => {
    await finishAnalysis(await postJson("/api/analyze-sample", { name }), `${name}.pcap`);
  });
}

function saveBaseline(run) {
  const name = state.baselineName.trim();
  if (!name) { state.error = "Give the snapshot a name first, for example plant-normal."; render(); return Promise.resolve(); }
  return act(`Saving ${name}.`, async () => {
    await postJson("/api/baselines", { name, run });
    await refresh();
    state.baseline = name; state.baselineName = ""; state.run = run;
    if (state.view !== "start") state.view = "changes";
    state.notice = `Saved your normal snapshot ${name}. It can no longer be changed.`;
  });
}

function runDoctor() {
  const image = state.doctorImage.trim();
  return act(`Testing ${image || "the tools"}. This takes about half a minute.`, async () => {
    const result = await postJson("/api/doctor", { image });
    await refresh();
    if (state.view !== "start") state.view = "doctor";
    state.notice = result.passed ? "Every tool still behaves as expected." : "Some tools behave differently. Details below.";
  });
}

function checkTools() {
  return act("Checking the tool versions.", async () => { state.toolCheck = await api("/api/tools"); });
}

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let out = "";
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(out);
}

function scanYara() {
  if (!state.rules.trim() || !state.ruleSample) {
    state.error = "Paste a rule and choose a file to scan.";
    render();
    return Promise.resolve();
  }
  const file = state.ruleSample;
  return act(`Scanning ${file.name}.`, async () => {
    const result = await postJson("/api/yara/scan", { rules: state.rules, filename: file.name, data: toBase64(await file.arrayBuffer()) });
    state.yara = { file: file.name, matches: result.matches };
  });
}

async function filesPayload(files) {
  return Promise.all(files.map(async (f) => ({ filename: f.name, data: toBase64(await f.arrayBuffer()) })));
}

function draftRule(confirmed) {
  if (!state.draftDesc.trim()) { state.error = "Describe what the rule should detect."; render(); return Promise.resolve(); }
  return act("Writing a rule, then compiling it and testing it on your files.", async () => {
    const result = await postJson("/api/yara/draft", {
      description: state.draftDesc, provider: state.draftProvider, model: state.draftModel.trim(), yes: confirmed === true,
      positives: await filesPayload(state.draftPositives), benign: await filesPayload(state.draftBenign),
    });
    if (result.needs_confirmation) { state.draftConfirm = result; state.draftResult = null; return; }
    state.draftConfirm = null;
    state.draftResult = result;
    await refresh();
  });
}

function checkPlc() {
  const f = state.plc.file;
  if (!f) { state.error = "Choose a PLC program file first."; render(); return Promise.resolve(); }
  if (f.size > 20 * 1024 * 1024) { state.error = "That file is larger than 20 MB."; render(); return Promise.resolve(); }
  return act(`Reviewing ${f.name}.`, async () => {
    state.plc.text = await f.text();
    state.plc.result = await postJson("/api/plc/check", { filename: f.name, text: state.plc.text, against: state.plc.name.trim() || undefined });
    state.plc.approveName = state.plc.approveName || state.plc.result.name;
  });
}

function approvePlc() {
  const name = (state.plc.approveName || "").trim();
  if (!name || !state.plc.text) { state.error = "Review a program first, and name it."; render(); return Promise.resolve(); }
  return act(`Approving ${name}.`, async () => {
    await postJson("/api/plc/approve", { name, filename: state.plc.file ? state.plc.file.name : name, text: state.plc.text });
    await refresh();
    state.notice = `Approved ${name}. Later uploads named ${name} are compared with this version, and it can no longer be changed.`;
  });
}

/* ---- device names ---- */
function labelOf(ip) { return (DATA.device_labels || {})[ip] || ""; }
function nameOf(ip) { const l = labelOf(ip); return l ? `${l} (${ip})` : ip; }
const SERVER_PROTOCOLS = ["s7comm", "modbus", "enip"];
function deviceRoles() {
  const roles = {};
  const add = (ip, role) => { roles[ip] = roles[ip] && roles[ip] !== role ? "both" : role; };
  for (const items of Object.values(DATA.observations)) {
    for (const [src, dst, proto] of items) { add(src, "client"); add(dst, SERVER_PROTOCOLS.includes(proto) ? "controller" : "server"); }
  }
  return roles;
}
const ROLE_TEXT = {
  client: "Looks like a client, such as an engineering laptop or HMI",
  controller: "Looks like a controller (it answers requests)",
  server: "Looks like a server",
  both: "Both sends and answers requests",
};

async function saveDevice(ip, label) {
  try {
    await postJson("/api/devices", { ip, label });
    await refresh();
    state.error = null;
    state.notice = label.trim() ? `Named ${ip} as ${label.trim()}.` : `Removed the name for ${ip}.`;
  } catch (e) { state.error = e.message || String(e); }
  render();
}

async function copyText(text, what) {
  try {
    await navigator.clipboard.writeText(text);
    state.error = null; state.notice = `Copied the ${what}. Paste it into an email or a ticket.`;
  } catch (e) {
    state.error = "Your browser would not allow copying. Select the text on the page instead.";
  }
  render();
}

function runDemo() {
  return act("Running the demo: reading a normal recording, saving it as normal, then reading a changed one. This takes about a minute.", async () => {
    const r = await api("/api/demo", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    await refresh();
    state.baseline = r.baseline; state.run = r.changed_run; state.trafficRun = r.changed_run;
    state.view = "changes";
    state.notice = "This is sample data. Now try your own: load a recording from your plant on the Start page.";
  });
}

/* ---- shared pieces ---- */
function runLabel(run) {
  const n = (DATA.observations[String(run.id)] || []).length;
  return `Recording ${run.id}, ${when(run.started_at)}, ${plural(n, "conversation")}, ${run.input_sha256.slice(0, 8)}`;
}
function observedRuns() {
  return DATA.runs.filter((r) => String(r.id) in DATA.observations);
}

function rungsFor(items, stateOf) {
  const order = { "new-pair": 0, "new-action": 1, "missing-pair": 2, "missing-action": 3, unchanged: 4, seen: 5 };
  return items
    .map((i) => ({ item: i, st: stateOf(i) }))
    .sort((a, b) => order[a.st] - order[b.st] || key(a.item).localeCompare(key(b.item)));
}

const STATE_TEXT = {
  "new-pair": "New device talking",
  "new-action": "New action",
  "missing-pair": "Went quiet",
  "missing-action": "Not seen",
  unchanged: "Same as normal",
  seen: "Seen",
};

function rung({ item, st }) {
  const [src, dst, proto, action] = item;
  const isConn = action === "conn";
  const node = (ip) => h("span", { class: "node" }, labelOf(ip) ? h("span", { class: "nm" }, labelOf(ip)) : null, ip);
  return h("li", { class: `rung ${st}` },
    node(src),
    h("span", { class: "wire" },
      h("span", { class: "contact" },
        h("span", { class: "proto" }, proto),
        isConn ? "" : h("span", { class: "act" }, " " + action))),
    node(dst),
    h("span", { class: "state" }, STATE_TEXT[st]));
}

function empty(title, ...lines) {
  return h("div", { class: "panel empty" }, h("p", { class: "section-title", style: "margin-top:0" }, title), ...lines);
}

function select(label, options, value, onChange) {
  const sel = h("select", { onchange: (e) => onChange(e.target.value) },
    options.map((o) => h("option", { value: o.value, selected: o.value === value }, o.label)));
  return h("label", {}, label, sel);
}

function btn(label, onClick, primary) {
  return h("button", { type: "button", class: `btn${primary ? " primary" : ""}`, disabled: !!state.busy, onclick: onClick }, label);
}

function dropZone() {
  const input = h("input", { type: "file", accept: ".pcap,.pcapng,.cap",
    onchange: (e) => { const f = e.target.files[0]; if (f) analyzeFile(f); } });
  const zone = h("label", { class: "drop",
    ondragover: (e) => { e.preventDefault(); zone.classList.add("over"); },
    ondragleave: () => zone.classList.remove("over"),
    ondrop: (e) => { e.preventDefault(); zone.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) analyzeFile(f); } },
    h("strong", {}, "Drop a recording here, or choose a file"),
    h("span", {}, "A .pcap or .pcapng file. It is only read. Nothing is sent to your network."),
    input);
  return zone;
}

function sampleButtons() {
  if (!state.samples.length) return null;
  return h("div", { class: "row", style: "margin-top:10px; align-items:center" },
    h("span", {}, "Just exploring? Try a sample recording:"),
    ...state.samples.map((n) => btn(n.replace(/_/g, " "), () => analyzeSample(n), false)));
}

function pcapHelp() {
  return h("details", { class: "explain" },
    h("summary", {}, "What is a recording, and where do I get one?"),
    h("p", {}, "A recording (a .pcap file) is a copy of the messages that crossed your network during some time, like a voice recorder for the network. Ask whoever manages your network switch to mirror a port to a laptop, then record for 30 to 60 minutes with Wireshark, or with the rehub capture command. Recording only listens. Never run a scanner on a live control network."));
}

function baselineForm(run) {
  return h("div", { class: "row" },
    h("label", {}, "Name for this normal snapshot",
      h("input", { type: "text", placeholder: "plant-normal", value: state.baselineName,
        oninput: (e) => { state.baselineName = e.target.value; } })),
    btn("Save as normal", () => saveBaseline(run), true));
}

function diffFor() {
  if (!state.baseline || state.run == null) return null;
  return DATA.diffs[`${state.baseline}|${state.run}`] || null;
}

/* ---- plain-language description of a change ---- */
const ACTION_SAY = {
  "program download": (s, d) => [`${s} sent a new program to ${d}.`, "A program download replaces the logic running on the controller."],
  "program upload": (s, d) => [`${s} copied the program from ${d}.`, "Someone read the controller's logic."],
  stop: (s, d) => [`${s} told ${d} to stop.`, "A stopped controller halts the process it runs."],
  "mode change": (s, d) => [`${s} changed the run mode of ${d}.`, "Switching modes can pause or restart the process."],
  "parameter write": (s, d) => [`${s} wrote new values to ${d}.`, "Check that the new values are intended."],
};

function describeChanges(d) {
  const out = [];
  for (const [rawSrc, rawDst] of d.new_pairs) {
    const src = nameOf(rawSrc), dst = nameOf(rawDst);
    out.push({ level: "high", say: `${src} started talking to ${dst} for the first time.`, hint: "This pair is not in your normal snapshot. Check that it is a device you know." });
  }
  for (const [rawSrc, rawDst, proto, action] of d.new_actions) {
    const src = nameOf(rawSrc), dst = nameOf(rawDst);
    const make = ACTION_SAY[action];
    if (make) {
      const [say, hint] = make(src, dst);
      out.push({ level: action === "program upload" ? "medium" : "high", say, hint });
    } else {
      out.push({ level: "medium", say: `${src} started using ${proto} with ${dst}.`, hint: "These two already talked, but not this way before." });
    }
  }
  for (const [rawSrc, rawDst] of d.missing_pairs) {
    const src = nameOf(rawSrc), dst = nameOf(rawDst);
    out.push({ level: "low", say: `${src} no longer talks to ${dst}.`, hint: "A device that used to talk went quiet. It may be off, moved or blocked." });
  }
  return out;
}

/* ---- the workflow ---- */
function toolsChecked() {
  if (state.toolCheck) return state.toolCheck.tools.every((t) => t.ok);
  return DATA.tools.length > 0;
}

function steps() {
  const runs = observedRuns();
  const hasBaseline = DATA.baselines.length > 0;
  const failing = DATA.doctor.filter((r) => r.status !== "PASS").length;
  const last = DATA.baselines[DATA.baselines.length - 1];
  return [
    { id: "tools", title: "Make sure your tools are ready",
      why: "rehub uses Zeek, Suricata, tshark and YARA. This confirms they are the exact versions it was tested with.",
      eta: "10 seconds",
      done: toolsChecked(), cli: "rehub tools",
      summary: state.toolCheck ? (state.toolCheck.tools.every((t) => t.ok) ? "All tools are the expected versions." : "Some tools are not the expected version.") : (DATA.tools.length ? "Tool versions were recorded by earlier runs." : "") },
    { id: "capture", title: "Load a recording of normal traffic",
      why: "Pick a recording taken on a normal day. rehub reads it and lists who talked to whom. If you can, start where the office network meets the plant network, or at the controllers you care about most.",
      eta: "about 1 minute",
      done: runs.length > 0, cli: "rehub analyze normal.pcap",
      summary: runs.length ? `${plural(runs.length, "recording")} loaded.` : "" },
    { id: "baseline", title: "Save it as your normal snapshot",
      why: "This remembers which devices talk and which actions are expected. A saved snapshot can never be changed. A longer recording is a better normal: record at least a full shift if you can, because short recordings miss rare but ordinary traffic.",
      eta: "10 seconds",
      done: hasBaseline, locked: runs.length === 0 ? "Load a recording first." : null, cli: "rehub baseline save plant-normal --run 1",
      summary: hasBaseline ? `Snapshot ${last.name} holds ${plural(last.count, "conversation")}.` : "" },
    { id: "compare", title: "Load a newer recording and see what changed",
      why: "Record again later, or after something odd, and load it. rehub shows new devices, risky commands and devices that went quiet.",
      eta: "about 1 minute",
      done: hasBaseline && runs.length >= 2, locked: hasBaseline ? null : "Save a normal snapshot first.", cli: "rehub baseline diff plant-normal --run 4",
      summary: hasBaseline && runs.length >= 2 ? "A newer recording is ready to compare." : "" },
    { id: "plc", title: "Check an updated PLC program",
      why: "Upload the program source. rehub flags risky patterns and shows what changed from the version you approved. It is a review, not a vulnerability scan.",
      eta: "about 1 minute",
      done: DATA.plc_programs.length > 0, cli: "rehub plc check program.st",
      summary: DATA.plc_programs.length ? `${plural(DATA.plc_programs.length, "approved version")} saved.` : "" },
    { id: "doctor", title: "Test a tool upgrade before you roll it out",
      why: "Before updating your monitoring tools, replay test recordings through the new version. rehub names anything it changes.",
      eta: "about 30 seconds",
      done: DATA.doctor.length > 0, cli: "rehub doctor",
      summary: DATA.doctor.length ? (failing ? `${plural(failing, "test")} came out different from expected.` : "Every tool behaves as expected.") : "" },
    { id: "rules", title: "Write a detection rule", optional: true,
      why: "Optional. Describe something to look for, let a model draft a rule, and have it tested on your files.",
      done: DATA.rules.length > 0, cli: 'rehub yara draft "what to detect" --positive sample.bin',
      summary: DATA.rules.length ? `${plural(DATA.rules.length, "rule")} saved.` : "" },
  ];
}

function nextStep() {
  return steps().find((st) => !st.done && !st.optional && !st.locked) || null;
}

function go(view) { state.view = view; state.error = null; state.notice = null; location.hash = view; render(); }

function stepBody(st, all) {
  const runs = observedRuns();
  const parts = [];
  if (!LIVE) {
    parts.push(h("p", { class: "cli" }, "Command line: ", h("code", {}, st.cli)));
    return parts;
  }
  if (st.id === "tools") {
    parts.push(btn("Check tool versions", checkTools, !st.done), toolCheckCard());
  } else if (st.id === "capture" && !st.done) {
    parts.push(dropZone(), sampleButtons(), pcapHelp());
  } else if (st.id === "capture") {
    parts.push(btn("See the conversations", () => go("traffic"), false));
  } else if (st.id === "baseline" && runs.length && !st.done) {
    parts.push(
      select("Which recording is normal?", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.run), (v) => { state.run = Number(v); render(); }),
      h("div", { style: "height:12px" }), baselineForm(state.run));
  } else if (st.id === "compare" && all.find((x) => x.id === "baseline").done) {
    if (runs.length < 2) {
      parts.push(dropZone(), sampleButtons());
    } else {
      parts.push(h("div", { class: "row" },
        btn("See what changed", () => go("changes"), true),
        h("span", {}, "Load another recording any time from Conversations.")));
    }
  } else if (st.id === "plc") {
    parts.push(btn(st.done ? "Check another program" : "Check a PLC program", () => go("plc"), !st.done));
  } else if (st.id === "doctor") {
    parts.push(h("div", { class: "row" },
      h("label", {}, "Tool image to test (blank for " + (DATA.image || "the default") + ")",
        h("input", { type: "text", placeholder: DATA.image || "rehub:pinned", value: state.doctorImage, oninput: (e) => { state.doctorImage = e.target.value; } })),
      btn(st.done ? "Test again" : "Run the upgrade check", runDoctor, !st.done),
      st.done ? btn("See the results", () => go("doctor"), false) : null));
  } else if (st.id === "rules") {
    parts.push(btn("Open detection rules", () => go("rules"), false));
  }
  return parts;
}

function dataCard() {
  const home = DATA.home || "~/.rehub";
  return h("div", { class: "panel card", style: "margin-top:20px; max-width:880px" },
    h("h3", {}, "Where your data is"),
    h("p", {}, "Everything stays on this computer. Nothing is sent anywhere unless you choose a hosted AI model, and then you see the exact text and confirm first."),
    h("div", { class: "datapaths" },
      h("div", {}, h("span", {}, "Database (one SQLite file): "), `${home}/rehub.db`),
      h("div", {}, h("span", {}, "Recordings you loaded: "), `${home}/uploads`),
      h("div", {}, h("span", {}, "Tool output: "), `${home}/runs`),
      h("div", {}, h("span", {}, "Settings: "), `${home}/config.toml`)),
    h("p", { style: "margin-top:10px" }, "Delete that folder to remove everything. Set REHUB_HOME to keep it somewhere else."));
}

function startChoice() {
  return h("div", { class: "choice" },
    h("div", { class: "opt" },
      h("h2", {}, "See it work in a minute"),
      h("p", {}, "Runs a made-up plant: a normal recording, then a changed one with a new device, a program download and a stop command. Nothing of yours is used."),
      btn("Run the demo", runDemo, true)),
    h("div", { class: "opt" },
      h("h2", {}, "Use my own recording"),
      h("p", {}, "Load a recording from your plant, save it as normal, then check later recordings against it."),
      btn("Load my recording", () => { const z = document.querySelector(".step .drop"); if (z) { z.scrollIntoView({ block: "center" }); z.focus(); } }, false)));
}

function progressBar(all) {
  const required = all.filter((x) => !x.optional);
  const done = required.filter((x) => x.done).length;
  return h("div", { class: "progress", role: "group", "aria-label": "Progress" },
    `${done} of ${required.length} steps done`,
    h("div", { class: "track" }, h("div", { class: "fill", style: `width:${Math.round((100 * done) / required.length)}%` })));
}

function viewStart() {
  const all = steps();
  const next = nextStep();
  const fresh = LIVE && observedRuns().length === 0 && DATA.baselines.length === 0;
  return [
    h("h1", {}, "Did anything change on your plant network?"),
    h("p", { class: "lede" }, "rehub compares a new recording of your network with one you called normal. It also reviews updated PLC programs and tests your monitoring tools. It only reads files and never sends anything to your network. Work down this list."),
    fresh ? startChoice() : null,
    LIVE ? progressBar(all) : null,
    h("ol", { class: "flow" }, all.map((st) => {

  }
  if (!DATA.baselines.length) {
    return [head, h("div", { class: "panel card" },
      h("h3", {}, "No normal snapshot yet"),
      h("p", {}, "A normal snapshot is the traffic you call normal. Save a recording as one, then compare later recordings with it. A saved snapshot never changes."),
      LIVE ? [
        select("Which recording is normal?", runs.map((r) => ({ value: String(r.id), label: runLabel(r) })), String(state.run), (v) => { state.run = Number(v); render(); }),

        baselineForm(state.run),

  }
  const d = diffFor();
  const base = DATA.baselines.find((b) => b.name === state.baseline);
  const run = DATA.observations[String(state.run)] || [];
  const baseKeys = new Set(base.items.map(key));
  const runKeys = new Set(run.map(key));
  const newPairs = new Set(d.new_pairs.map(pairKey));
  const missingPairs = new Set(d.missing_pairs.map(pairKey));

  const all = [...new Map([...base.items, ...run].map((i) => [key(i), i])).values()];
  const rows = rungsFor(all, (i) => {
    const inRun = runKeys.has(key(i)), inBase = baseKeys.has(key(i));
    if (inRun && inBase) return "unchanged";

    return missingPairs.has(pairKey(i)) ? "missing-pair" : "missing-action";
  });
  const said = describeChanges(d);
  const verdict = d.clean
    ? "This recording matches your normal snapshot. Nothing new, nothing missing."
    : `Compared with your normal snapshot: ${plural(d.new_pairs.length, "new device pair")}, ${plural(d.new_actions.length, "new action")}, ${plural(d.missing_pairs.length, "pair")} gone quiet.`;

      select("Normal snapshot", DATA.baselines.map((b) => ({ value: b.name, label: `${b.name} (${plural(b.count, "conversation")}, ${b.sha256.slice(0, 8)})` })), state.baseline,

      h("ul", { class: "changes" }, said.map((c) => h("li", { class: c.level }, h("span", { class: "said" }, c.say), h("span", { class: "hint" }, c.hint))))] : null,

function plcSummary(r) {
  const lines = [`rehub: PLC program review of ${r.filename}`, ""];
  r.findings.forEach((f) => lines.push(`- [${f.severity}] line ${f.line}: ${f.title}`, `  ${f.code}`, `  Why: ${f.why}`, `  Check: ${f.check}`));
  if (r.comparison) {
    lines.push("", `Compared with approved version of ${r.comparison.against}:`);
    r.comparison.value_changes.forEach((v) => lines.push(`  value changed on line ${v.line}: ${v.before} -> ${v.after}`));
    r.comparison.added.forEach((l) => lines.push(`  + ${l}`));
    r.comparison.removed.forEach((l) => lines.push(`  - ${l}`));
  }
  lines.push("", "This is a pattern review, not a vulnerability scan.");
  return lines.join("\n");
}

function plcResult(r) {
  const n = r.counts;
  const total = n.high + n.medium + n.low;
  const norm = (f) => f.rule + "|" + f.code.replace(/\s+/g, " ").toLowerCase();
  const fresh = new Set(r.comparison ? r.comparison.new_findings.map(norm) : []);
  return [
    h("div", { class: "panel card" },
      h("h3", {}, total ? `${plural(total, "thing")} to review in ${r.filename}` : `Nothing risky found in ${r.filename}`),
      h("p", {}, total
        ? `${n.high} high, ${n.medium} medium, ${n.low} low. Each one says why it matters and what to check.`
        : "These checks found nothing. That does not mean the program is safe: the checks look for a short list of patterns."),
      total ? h("div", { class: "panel", style: "margin-top:8px" }, r.findings.map((f) => findingCard(f, fresh.has(norm(f))))) : null,
      h("div", { style: "margin-top:12px" }, btn("Copy summary", () => copyText(plcSummary(r), "summary"), false))),
    r.comparison ? comparisonCard(r.comparison)
      : h("div", { class: "panel card" }, h("h3", {}, "No approved version to compare with"),
          h("p", {}, `There is no approved program named ${r.name} yet. If you trust this version, approve it below. Later uploads with the same name are compared with it and every change is shown.`)),
    LIVE ? h("div", { class: "panel card" },
      h("h3", {}, "Approve this version"),
      h("p", {}, "Only approve a version a person has reviewed. Approved versions are kept and can never be changed."),
      h("div", { class: "row" },
        h("label", {}, "Program name",
          h("input", { type: "text", value: state.plc.approveName, placeholder: r.name, oninput: (e) => { state.plc.approveName = e.target.value; } })),
        btn("Approve this version", approvePlc, true))) : null,
  ];
}

function viewDoctor() {
  const parts = [h("h1", {}, "Upgrade check")];
  parts.push(h("p", { class: "lede" }, "Your monitoring tools change between versions, and a change can quietly alter what they report. This replays built-in test recordings through every tool and compares the results with what was expected. Run it on a new version before you roll it out."));
  if (LIVE) {
    parts.push(h("div", { class: "panel card" },
      h("h3", {}, "Test a tool image"),
      h("p", {}, "Leave the image blank to test " + (DATA.image || "the default image") + ". To test an upgrade first, enter the new image, for example rehub:candidate."),
      h("div", { class: "row" },
        h("label", {}, "Image",
          h("input", { type: "text", placeholder: DATA.image || "rehub:pinned", value: state.doctorImage,
            oninput: (e) => { state.doctorImage = e.target.value; } })),
        btn("Run the upgrade check", runDoctor, true),
        btn("Check tool versions", checkTools, false))),
      toolCheckCard());
  }
  if (!DATA.doctor.length) {
    parts.push(empty("Not run yet",
      LIVE ? h("p", {}, "Run it above to compare every tool with what was expected.") : [h("p", {}, "Run it from the command line:"), h("p", {}, h("code", {}, "rehub doctor"))]));
    return parts;
  }
  const byTool = new Map();
  for (const r of DATA.doctor) byTool.set(r.tool, [...(byTool.get(r.tool) || []), r]);
  const failedTool = ([, rows]) => rows.some((r) => r.status !== "PASS");
  const ordered = [...byTool].sort((a, b) => failedTool(b) - failedTool(a) || a[0].localeCompare(b[0]));
  for (const [tool, rows] of ordered) {
    const failed = failedTool([tool, rows]);
    parts.push(h("section", { class: `panel tool ${failed ? "fail" : ""}` },
      h("header", {},
        h("h2", {}, tool),
        h("span", { class: "ver" }, `${rows[0].version} in ${rows[0].image}`),
        h("span", { class: "verdict" }, failed ? "Behaves differently" : "Behaves as expected")),
      rows.map((r) => h("div", { class: `fx ${r.status === "PASS" ? "" : "fail"}` },
        h("span", { class: "name" }, r.fixture),
        h("span", { class: "status" }, r.status === "PASS" ? "Pass" : "Fail"),
        r.lines.length ? h("ul", {}, r.lines.map((l) => h("li", {}, l))) : h("span")))));
  }
  return parts;
}

function draftResult(r) {
  const ok = r.status === "validated";
  const lines = [`Compile attempts: ${r.attempts}`];
  if (r.compile_error) lines.push(`Compiler error: ${r.compile_error}`);
  for (const [name, matched] of Object.entries(r.positives)) lines.push(`${name}: ${matched ? "matched" : "missed"}`);
  for (const name of r.benign_hits) lines.push(`${name}: matched, and it should not have`);
  return h("div", { style: "margin-top:16px" },
    h("div", { class: "row", style: "align-items:center" },
      h("h3", { style: "margin:0" }, "Drafted rule"),
      h("span", { class: `badge ${r.status}` }, ok ? "Validated" : "Unvalidated"),
      r.reason ? h("span", {}, r.reason) : null),
    h("pre", { style: "margin-top:8px" }, r.rule || "(no rule text)"),
    h("ul", { class: "matches" }, lines.map((l) => h("li", {}, l))),
    ok ? null : h("p", { style: "margin-top:10px" }, "A model wrote this rule and it did not pass every test. Review it before using it."));
}

    h("header", {},
      h("h2", {}, r.name),
      h("span", { class: `badge ${r.status}` }, r.status === "validated" ? "Validated" : "Unvalidated"),
      h("span", { class: "when" }, when(r.created_at))),
    h("pre", {}, r.text))));
  return parts;
}

/* ---- help assistant ---- */
const QUICK_QUESTIONS = [
  "What is a capture (pcap) file?",
  "Where do I get a capture?",
  "What is a normal snapshot?",
  "Is it safe to use on a live plant?",
  "Where is my data stored?",
  "Can it find CVEs in my PLC?",
];

async function askHelp(question, useModel, yes) {
  const q = question.trim();
  if (!q || state.help.busy) return;
  state.help.busy = true; state.help.error = null; renderHelp();
  try {
    const res = await postJson("/api/guide", { question: q, use_model: !!useModel, provider: state.help.provider, model: state.help.model.trim(), yes: yes === true });
    if (res.needs_confirmation) { state.help.confirm = { ...res, question: q }; }
    else { state.help.confirm = null; state.help.log.push({ q, res }); state.help.question = ""; }
  } catch (e) {
    state.help.error = e.message || String(e);
  }
  state.help.busy = false;
  renderHelp();
  const asked = document.querySelectorAll("#help .log .q");
  if (asked.length) asked[asked.length - 1].scrollIntoView({ block: "start" });
}

function renderHelp() {
  const btnEl = document.getElementById("helpbtn");
  const panel = document.getElementById("help");
  btnEl.hidden = !LIVE;
  btnEl.setAttribute("aria-expanded", String(state.help.open));
  panel.hidden = !LIVE || !state.help.open;
  if (panel.hidden) return;
  const hp = state.help;
  const entries = hp.log.map(({ q, res }) => [
    h("p", { class: "q" }, q),
    res.source === "none"
      ? h("div", {}, h("p", { class: "a" }, "I do not have a built-in answer for that. I can explain these:"),
          h("div", { class: "chips" }, res.topics.map((t) => h("button", { type: "button", class: "chip", onclick: () => askHelp(t, false) }, t))),
          h("button", { type: "button", class: "chip", onclick: () => askHelp(q, true) }, "Ask the AI model instead"))
      : h("div", {}, h("p", { class: "a" }, res.answer),
          h("span", { class: "src" }, res.source === "model" ? `Answer from the ${res.provider} model. It can be wrong.` : "From the built-in manual.")),
  ]);
  const confirm = hp.confirm ? h("div", { class: "boxed" },
    h("strong", {}, `Nothing has been sent yet. This question and the built-in manual would go to ${hp.confirm.provider}:`),
    h("pre", {}, hp.confirm.user),
    h("details", {}, h("summary", {}, "Show the manual that goes with it"), h("pre", {}, hp.confirm.system)),
    h("div", { class: "row", style: "margin-top:8px" },
      h("button", { type: "button", class: "btn primary", onclick: () => askHelp(hp.confirm.question, true, true) }, `Send to ${hp.confirm.provider}`),
      h("button", { type: "button", class: "btn", onclick: () => { hp.confirm = null; renderHelp(); } }, "Cancel"))) : null;
  const input = h("input", { type: "text", "aria-label": "Your question", placeholder: "Ask anything about using rehub", value: hp.question,
    oninput: (e) => { hp.question = e.target.value; } });
  panel.replaceChildren(
    h("header", {}, h("strong", {}, "Ask about rehub"), h("span", {}, "Answers come from the built-in manual. Your recordings and code are never part of a question.")),
    h("div", { class: "log" },
      entries.length ? entries : h("div", {}, h("p", { class: "a" }, "Not sure where to start? Pick a question:"),
        h("div", { class: "chips" }, QUICK_QUESTIONS.map((t) => h("button", { type: "button", class: "chip", onclick: () => askHelp(t, false) }, t)))),
      confirm,
      hp.error ? h("p", { class: "a", role: "alert", style: "color:var(--major)" }, hp.error) : null,
      hp.busy ? h("p", { class: "src" }, "Thinking...") : null),
    h("details", {},
      h("summary", {}, "Use an AI model for other questions"),
      h("div", { class: "row", style: "margin-top:8px" },
        select("Model", [{ value: "ollama", label: "Local (Ollama)" }, { value: "anthropic", label: "Hosted (Anthropic)" }], hp.provider, (v) => { hp.provider = v; hp.confirm = null; renderHelp(); }),
        h("label", {}, "Model name", h("input", { type: "text", placeholder: hp.provider === "anthropic" ? "default" : "your Ollama model", value: hp.model, oninput: (e) => { hp.model = e.target.value; } }))),
      h("div", { style: "margin-top:8px" }, h("button", { type: "button", class: "btn", onclick: () => askHelp(hp.question, true) }, "Ask the model"))),
    h("form", { onsubmit: (e) => { e.preventDefault(); askHelp(hp.question, false); } }, input,
      h("button", { type: "submit", class: "btn primary", disabled: hp.busy }, "Ask")));
}

document.getElementById("helpbtn").addEventListener("click", () => { state.help.open = !state.help.open; renderHelp(); });

/* ---- shell ---- */
function annunciator() {
  const d = diffFor();
  const fails = DATA.doctor.filter((r) => r.status !== "PASS").length;
  const windows = [
    ["New device pair", d ? d.new_pairs.length : 0, "major", !!d],
    ["New action", d ? d.new_actions.length : 0, "minor", !!d],
    ["Went quiet", d ? d.missing_pairs.length : 0, "advisory", !!d],
    ["Upgrade check failing", fails, "major", DATA.doctor.length > 0],
  ];
  const box = document.getElementById("annunciator");
  box.hidden = state.view === "start" && windows.every(([, n]) => n === 0);
  box.replaceChildren(...windows.map(([legend, n, level, known]) =>
    h("div", { class: `win ${n ? "lit " + level : ""}`, "aria-label": known ? false : `${legend}: not checked yet` },
      h("span", { class: "lamp", "aria-hidden": "true" }),
      h("span", { class: "legend" }, legend),
      h("span", { class: "count", title: known ? "" : "Not checked yet" }, known ? n : "-"))));
}

function banner() {
  const box = document.getElementById("banner");
  if (state.busy) box.replaceChildren(h("div", { class: "banner busy", role: "status" }, state.busy));
  else if (state.error) box.replaceChildren(h("div", { class: "banner error", role: "alert" }, h("strong", {}, "That did not work. "), state.error));
  else if (state.notice) box.replaceChildren(h("div", { class: "banner", role: "status" }, state.notice));
  else box.replaceChildren();
}

function renderNav() {
  document.getElementById("nav").replaceChildren(...VIEWS.map((v) =>
    h("button", { type: "button", "aria-current": v.id === state.view ? "page" : false, onclick: () => go(v.id) }, v.label)));
}

function render() {
  renderNav();
  annunciator();
  banner();
  const body = { start: viewStart, changes: viewChanges, traffic: viewTraffic, plc: viewPlc, doctor: viewDoctor, rules: viewRules }[state.view]();
  const line = LIVE ? nextLine() : null;
  if (line) body.splice(1, 0, line);
  document.getElementById("view").replaceChildren(...body.flat(Infinity).filter(Boolean));
  renderHelp();
}

async function init() {
  const wanted = location.hash.slice(1);
  if (!LIVE) state.view = "changes";
  if (VIEWS.some((v) => v.id === wanted)) state.view = wanted;
  if (LIVE) {
    try {
      await refresh();
    } catch (e) {
      document.getElementById("view").replaceChildren(
        h("h1", {}, e.locked ? "This session ended" : "Cannot reach rehub"),
        empty(e.locked ? "Open the private link again" : "The local server did not answer", h("p", {}, e.message), h("p", {}, "Start it again with ", h("code", {}, "rehub web"), ".")));
      return;
    }
    await loadSamples();
    document.getElementById("meta").textContent = `Your data stays on this computer in ${DATA.home}. Tools run in ${DATA.image} with no network.`;
  } else {
    pickDefaults();
    document.getElementById("meta").textContent = `Snapshot of ${when(DATA.generated_at)}. Read only.`;
  }
  render();
}
init();
</script>
