name: publish-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rehub

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tag matches pyproject version
        run: test "v$(uv version --short)" = "${{ github.ref_name }}"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: scripts/check_no_send.sh
      - run: uv run pytest -q

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 and check it with doctor before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rehub:gate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm rehub:gate rehub tools
      - run: docker run --rm rehub:gate rehub doctor
      - name: Push amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
