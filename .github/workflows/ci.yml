name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: No packet-sending code paths
        run: scripts/check_no_send.sh
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: docker build -f docker/Dockerfile -t rehub:pinned .
      - name: Pinned tools match
        run: docker run --rm rehub:pinned rehub tools
      - name: Doctor passes on the pinned image
        run: docker run --rm rehub:pinned rehub doctor
      - name: Tests that need the image
        run: uv sync --frozen && uv run pytest -q -m docker
